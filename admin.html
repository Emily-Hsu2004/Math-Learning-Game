<!-- 登入 -->
<div id="login" class="min-h-screen flex items-center justify-center p-4">
  <div class="bg-white rounded-3xl shadow-xl border border-slate-200 p-6 md:p-8 w-full max-w-sm">
    <h1 class="text-2xl font-black text-slate-800 mb-1">🌀 颱風危機</h1>
    <p class="text-sm text-slate-500 mb-6">老師後台</p>
    <label class="block text-sm text-slate-600 mb-1" for="a-account">老師帳號</label>
    <input id="a-account" type="text" autocomplete="username" autocapitalize="off" spellcheck="false" class="w-full border-2 border-slate-300 focus:border-sky-500 rounded-xl px-4 py-3 text-lg outline-none mb-4">
    <label class="block text-sm text-slate-600 mb-1" for="a-password">密碼</label>
    <input id="a-password" type="password" autocomplete="current-password" class="w-full border-2 border-slate-300 focus:border-sky-500 rounded-xl px-4 py-3 text-lg outline-none">

    <p id="cfg-note" class="hidden text-sm text-amber-700 bg-amber-50 border border-amber-200 rounded-lg p-3 mt-4"></p>
  </div>
</div>

<!-- 主畫面 -->
<div id="app" class="hidden">
  <header class="bg-gradient-to-r from-sky-600 to-indigo-700 text-white sticky top-0 z-20 shadow">
    <div class="max-w-6xl mx-auto px-4 pt-3 pb-2 flex flex-wrap items-center gap-x-4 gap-y-2">
      <h1 class="font-bold text-lg">🌀 颱風危機｜老師後台</h1>
      <span id="last-update" class="text-xs text-sky-100"></span>
      <div class="ml-auto flex items-center gap-2 flex-wrap">
        <label class="flex items-center gap-1.5 text-sm bg-white/10 rounded-lg px-2.5 py-1.5"><input type="checkbox" id="auto"> 每 10 秒自動更新</label>
        <button id="btn-refresh" class="bg-white/15 hover:bg-white/25 rounded-lg px-3 py-1.5 text-sm font-bold">↻ 更新</button>
        <button id="btn-logout" class="bg-white/15 hover:bg-white/25 rounded-lg px-3 py-1.5 text-sm font-bold">登出</button>
      </div>
    </div>
    <nav id="tabs" class="max-w-6xl mx-auto px-2 flex gap-1 overflow-x-auto text-sm font-bold">
      <button data-tab="board" class="tab px-3 py-2 rounded-t-lg whitespace-nowrap">課堂看板</button>
      <button data-tab="items" class="tab px-3 py-2 rounded-t-lg whitespace-nowrap">題目分析</button>
      <button data-tab="rank" class="tab px-3 py-2 rounded-t-lg whitespace-nowrap">第三關排名</button>
      <button data-tab="log" class="tab px-3 py-2 rounded-t-lg whitespace-nowrap">作答明細</button>
      <button data-tab="students" class="tab px-3 py-2 rounded-t-lg whitespace-nowrap">學生名單</button>
      <button data-tab="settings" class="tab px-3 py-2 rounded-t-lg whitespace-nowrap">設定</button>
    </nav>
  </header>

  <section id="filters" class="bg-white border-b border-slate-200">
    <div class="max-w-6xl mx-auto px-4 py-3 flex flex-wrap items-end gap-3 text-sm">
      <label class="flex flex-col gap-1"><span class="text-slate-500">日期</span><input type="date" id="f-date" class="border border-slate-300 rounded-lg px-2 py-1.5"></label>
      <label class="flex flex-col gap-1"><span class="text-slate-500">從</span><input type="time" id="f-from" value="00:00" class="border border-slate-300 rounded-lg px-2 py-1.5"></label>
      <label class="flex flex-col gap-1"><span class="text-slate-500">到</span><input type="time" id="f-to" value="23:59" class="border border-slate-300 rounded-lg px-2 py-1.5"></label>
      <label class="flex items-center gap-1.5 pb-2"><input type="checkbox" id="f-all"> 全部時間</label>
      <label class="flex flex-col gap-1"><span class="text-slate-500">關卡</span>
        <select id="f-level" class="border border-slate-300 rounded-lg px-2 py-1.5"><option value="">全部</option><option value="1">第一關</option><option value="2">第二關</option><option value="3">第三關</option></select></label>
      <label class="flex flex-col gap-1"><span class="text-slate-500">座號</span><input type="number" id="f-seat" min="1" placeholder="全部" class="border border-slate-300 rounded-lg px-2 py-1.5 w-20"></label>
      <button id="f-apply" class="bg-sky-600 hover:bg-sky-700 text-white font-bold rounded-lg px-4 py-2">套用篩選</button>
      <button id="f-today" class="bg-slate-200 hover:bg-slate-300 font-bold rounded-lg px-3 py-2">今天</button>
    </div>
  </section>

  <main id="view" class="max-w-6xl mx-auto px-4 py-4 pb-16"></main>
</div>

<script>
/* ---------- 設定與連線 ---------- */
const CFG = window.GAME_CONFIG || {};
const ONLINE = !!(CFG.supabaseUrl && CFG.supabaseKey);
const $ = id => document.getElementById(id);
const esc = v => String(v == null ? '' : v).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const store = {
  get(k) { try { return JSON.parse(localStorage.getItem(k)); } catch (e) { return null; } },
  set(k, v) { try { localStorage.setItem(k, JSON.stringify(v)); } catch (e) {} },
  del(k) { try { localStorage.removeItem(k); } catch (e) {} }
};
async function rpc(name, body) {
  const headers = { 'Content-Type': 'application/json', apikey: CFG.supabaseKey };
  if (CFG.supabaseKey.startsWith('eyJ')) headers.Authorization = 'Bearer ' + CFG.supabaseKey;
  let res;
  try { res = await fetch(CFG.supabaseUrl.trim().replace(/\/+$/, '') + '/rest/v1/rpc/' + name, { method: 'POST', headers, body: JSON.stringify(body) }); }
  catch (e) { throw new Error('連不到 Supabase。請確認網址、專案沒有暫停，以及網路沒有擋 supabase.co。'); }
  if (!res.ok) {
    const t = await res.text(); let info = {}; try { info = JSON.parse(t); } catch (e) {}
    if (info.code === 'PGRST202') throw new Error('找不到老師後台的資料庫函式，請到 SQL Editor 重新執行最新版的 setup.sql。');
    throw new Error('伺服器回應錯誤（' + (info.code || res.status) + '）：' + (info.message || t).slice(0, 150));
  }
  return res.json();
}
const TOKEN_KEY = 'typhoon.admin.token';
const token = () => store.get(TOKEN_KEY);

/* ---------- 題目與錯誤類型名稱 ---------- */
const ITEM_NAMES = {
  1: { A: '漁船 A：點出 [3, 60°]', B: '漁船 B：點出 [4, 135°]', C: '漁船 C：讀出 [2, 300°]', T: '颱風中心：讀出 [140 公里, 315°]', S: '補給船：點出 [2, 30°]', H: '直升機：點出轉 390°' },
  2: { P: 'P[2, 30°] → (x, y)', Q: 'Q[4, 120°] → (x, y)', R: 'R[3, 270°] → (x, y)', S: 'S(3, 4) → r', T: 'T(−6, 8) → r' },
  3: { 1: '第 1 題 讀點：雷達上的撤離點', 2: '第 2 題 同界角：逆時針 420°、2 格', 3: '第 3 題 極 → 直：[4, 150°]', 4: '第 4 題 極 → 直：[4, 225°]', 5: '第 5 題 求 r：(−3, −4)', 6: '第 6 題 直 → 極：(−3, 3)' }
};
const ITEM_ORDER = { 1: ['A', 'B', 'C', 'T', 'S', 'H'], 2: ['P', 'Q', 'R', 'S', 'T'], 3: ['1', '2', '3', '4', '5', '6'] };
const TAGS = {
  ok: '答對', negative_angle: '答對（用負角）', north_cw: '從正北順時針量（方位角）', clockwise: '方向轉反（順時針）', distance: '距離數錯',
  other: '其他', km_unit: '沒換算成公里', mirror: '上下方向弄反', angle: '角度錯', over_turn: '轉超過一圈', swap: 'x、y 對調',
  sign: '正負號錯', axis: '軸上的點判斷錯', add: '把 x、y 直接相加', no_sqrt: '忘了開根號', negative: 'r 取負值', blank: '未作答'
};
const tagName = t => TAGS[t] || t || '—';
const plain = v => {
  if (v == null) return '';
  const t = typeof v === 'string' ? v : JSON.stringify(v);
  return t.replace(/\\sqrt\{(\d+)\}/g, '√$1').replace(/\^\\circ/g, '°').replace(/\\ /g, ' ').replace(/-/g, '−');
};
/* 第三關題目（與 index.html 的 L3_ITEMS 對應）：opts 第 0 個是正解，tag 是錯誤選項對應的迷思；
   show 是講解畫面上 A～D 的排列（存的是 opts 的編號），避免正解永遠排在 A */
const L3_Q = [
  { q: '讀出雷達上撤離點的極坐標 [r, θ]。', pt: [3, 150],
    opts: [['[3, 150°]'], ['[150°, 3]', 'r、θ 順序寫反'], ['[3, 30°]', '從 x 軸負向量角'], ['[3, 210°]', '順時針量角']], show: [2, 1, 0, 3],
    sol: ['從極軸（正東）逆時針量：放射線每條 15°，數到撤離點共 10 條 → θ = 150°。', '撤離點在第 3 圈 → r = 3。', '先寫距離、再寫角度：[3, 150°]。'] },
  { q: '直升機從極軸出發，逆時針飛了 420°，停在離雷達站 2 格的地方。依約定（0° ≤ θ < 360°）寫出它的極坐標。',
    opts: [['[2, 60°]'], ['[2, 420°]', '沒換到 0°～360°'], ['[2, −60°]', '旋轉方向弄反'], ['[2, 300°]', '用 360° 去減']], show: [1, 0, 3, 2],
    sol: ['420° 比一圈多：420° − 360° = 60°，兩個角是同界角，終邊相同。', '依約定 0° ≤ θ < 360°，寫成 [2, 60°]。', '300° 是 360° − 60°，方向反了。'] },
  { q: '[4, 150°] 換成直角坐標 (x, y)。',
    opts: [['(−2√3, 2)'], ['(2√3, 2)', '忽略負號'], ['(2, −2√3)', 'x、y 對調'], ['(−2, 2√3)', 'sin、cos 用反']], show: [1, 3, 2, 0],
    sol: ['x = r cos θ = 4 cos 150° = 4 × (−√3 / 2) = −2√3', 'y = r sin θ = 4 sin 150° = 4 × (1 / 2) = 2', '150° 在第二象限：x 負、y 正 → (−2√3, 2)。'] },
  { q: '[4, 225°] 換成直角坐標 (x, y)。',
    opts: [['(−2√2, −2√2)'], ['(2√2, 2√2)', '忽略負號'], ['(−4, −4)', '把 r 當成 x、y'], ['(−2√2, 2√2)', 'sin 的正負號錯']], show: [3, 2, 0, 1],
    sol: ['x = 4 cos 225° = 4 × (−√2 / 2) = −2√2', 'y = 4 sin 225° = 4 × (−√2 / 2) = −2√2', '225° 在第三象限：x、y 都是負的。'] },
  { q: '直升機回報 (−3, −4)，它離雷達站多遠？',
    opts: [['r = 5'], ['r = 7', 'r 用 |x| + |y|'], ['r = 25', '忘了開根號'], ['r = √7', 'r 用 y² − x²']], show: [2, 0, 3, 1],
    sol: ['r = √(x² + y²) = √((−3)² + (−4)²)', '= √(9 + 16) = √25 = 5', '負號平方後變正，r 一定 ≥ 0。'] },
  { q: '直升機回報 (−3, 3)，寫出它的極坐標 [r, θ]。', pt: [Math.hypot(3, 3), 135],
    opts: [['[3√2, 135°]'], ['[3√2, 45°]', '角度看錯方向'], ['[6, 135°]', 'r 用 |x| + |y|'], ['[3, 135°]', 'r 只取 |x|']], show: [3, 1, 0, 2],
    sol: ['r = √((−3)² + 3²) = √18 = 3√2', '點在第二象限，|x| = |y|，正好在 135° 的放射線上（從雷達上可以直接讀出）。', '答案：[3√2, 135°]。'] }
];
const fmtT = t => t ? new Date(t).toLocaleString('zh-TW', { timeZone: 'Asia/Taipei', hour12: false, month: '2-digit', day: '2-digit', hour: '2-digit', minute: '2-digit', second: '2-digit' }) : '—';
const fmtSec = s => s == null ? '—' : `${Math.floor(s / 60)}:${String(Math.round(s % 60)).padStart(2, '0')}`;
const pct = (a, b) => b ? Math.round(a / b * 100) : 0;

/* ---------- 狀態 ---------- */
let DATA = null, TAB = 'board', timer = null, showPw = false, RANK_TOP3 = false;

/* ---------- 登入 ---------- */
function showLoginPage(msg) {
  $('app').classList.add('hidden'); $('login').classList.remove('hidden');
  if (msg) { $('a-err').textContent = msg; $('a-err').classList.remove('hidden'); }
  if (!ONLINE) {
    const why = window.__configMissing ? '找不到 config.js。' : !window.GAME_CONFIG ? 'config.js 有格式錯誤。' : 'config.js 的 supabaseUrl 或 supabaseKey 還沒填。';
    $('cfg-note').textContent = '老師後台需要先接上 Supabase：' + why;
    $('cfg-note').classList.remove('hidden');
    $('a-login').disabled = true;
  }
}
async function doLogin() {
  const a = $('a-account').value.trim(), p = $('a-password').value;
  if (!a || !p) return showLoginPage('請輸入帳號和密碼。');
  $('a-login').disabled = true; $('a-login').textContent = '登入中……'; $('a-err').classList.add('hidden');
  try {
    const r = await rpc('game_login', { p_account: a, p_password: p });
    if (!r.ok) return showLoginPage('帳號或密碼不正確。');
    store.set(TOKEN_KEY, r.token);
    $('a-password').value = '';
    await refresh(true);
  } catch (e) { showLoginPage(e.message); }
  finally { $('a-login').disabled = !ONLINE; $('a-login').textContent = '登入'; }
}
$('a-login').onclick = doLogin;
$('a-password').addEventListener('keydown', e => { if (e.key === 'Enter') doLogin(); });
$('btn-logout').onclick = () => { store.del(TOKEN_KEY); clearInterval(timer); $('auto').checked = false; showLoginPage(); };

/* ---------- 讀資料 ---------- */
function range() {
  if ($('f-all').checked || !$('f-date').value) return { from: null, to: null };
  const d = $('f-date').value, f = $('f-from').value || '00:00', t = $('f-to').value || '23:59';
  return { from: new Date(`${d}T${f}:00`).toISOString(), to: new Date(new Date(`${d}T${t}:00`).getTime() + 60000).toISOString() };
}
async function refresh(first) {
  if (!token()) return showLoginPage();
  const { from, to } = range();
  try {
    const r = await rpc('admin_data', { p_token: token(), p_from: from, p_to: to });
    if (!r.ok) {
      store.del(TOKEN_KEY);
      return showLoginPage(r.reason === 'teacher' ? '這個帳號不是老師帳號（students 表的 role 要是 teacher），或登入已過期。' : '請重新登入。');
    }
    DATA = r;
    $('login').classList.add('hidden'); $('app').classList.remove('hidden');
    $('last-update').textContent = '更新於 ' + fmtT(new Date());
    render();
  } catch (e) {
    if (first) showLoginPage(e.message);
    else $('last-update').textContent = '⚠️ ' + e.message;
  }
}
$('btn-refresh').onclick = () => refresh();
$('f-apply').onclick = () => refresh();
$('f-today').onclick = () => { $('f-date').value = todayStr(); $('f-from').value = '00:00'; $('f-to').value = '23:59'; $('f-all').checked = false; refresh(); };
$('f-level').onchange = () => render();
$('f-seat').oninput = () => render();
$('auto').onchange = () => {
  clearInterval(timer);
  if ($('auto').checked) timer = setInterval(() => { if (document.visibilityState === 'visible') refresh(); }, 10000);
};
function todayStr() { return new Date().toLocaleDateString('en-CA', { timeZone: 'Asia/Taipei' }); }
$('f-date').value = todayStr();

document.querySelectorAll('.tab').forEach(b => b.onclick = () => { TAB = b.dataset.tab; render(); });

/* ---------- 共用 ---------- */
function filteredAttempts() {
  const lv = $('f-level').value, seat = $('f-seat').value;
  return DATA.attempts.filter(a => (!lv || String(a.level) === lv) && (!seat || String(a.seat) === seat));
}
const card = (title, inner, extra = '') => `<section class="bg-white rounded-2xl border border-slate-200 shadow-sm p-4 mb-4 ${extra}"><h2 class="font-bold text-slate-800 mb-3">${title}</h2>${inner}</section>`;
const table = (head, rows) => `<div class="overflow-x-auto"><table class="w-full text-sm"><thead><tr class="text-left text-slate-500 border-b border-slate-200">${head.map(h => `<th>${h}</th>`).join('')}</tr></thead><tbody>${rows.join('') || `<tr><td colspan="${head.length}" class="text-slate-400 text-center py-6">沒有資料</td></tr>`}</tbody></table></div>`;
const nickOf = seat => { const st = DATA && (DATA.students || []).find(x => x.seat === seat); return st && st.nickname ? st.nickname : ''; };
const nickCell = v => v ? esc(v) : '<span class="text-slate-400">（未取）</span>';
function groupBy(arr, keyFn) { const m = new Map(); arr.forEach(x => { const k = keyFn(x); if (!m.has(k)) m.set(k, []); m.get(k).push(x); }); return m; }

/* ---------- 各分頁 ---------- */
function render() {
  document.querySelectorAll('.tab').forEach(b => b.classList.toggle('tab-on', b.dataset.tab === TAB));
  $('filters').classList.toggle('hidden', TAB === 'settings' || TAB === 'students');
  const v = $('view');
  if (!DATA) { v.innerHTML = ''; return; }
  v.innerHTML = ({ board: viewBoard, items: viewItems, rank: viewRank, log: viewLog, students: viewStudents, settings: viewSettings })[TAB]();
  bindView();
}

function viewBoard() {
  const st = DATA.students, n = st.length;
  const unl = lv => st.filter(s => (s.unlocked || []).includes(lv)).length;
  const runs = DATA.runs, done = runs.filter(r => r.submitted_at), doing = runs.filter(r => !r.submitted_at);
  const avg = done.length ? (done.reduce((a, r) => a + r.score, 0) / done.length).toFixed(1) : '—';
  const stat = (label, val, sub = '') => `<div class="bg-white rounded-2xl border border-slate-200 p-4"><div class="text-xs text-slate-500">${label}</div><div class="text-3xl font-black text-slate-800">${val}</div><div class="text-xs text-slate-400">${sub}</div></div>`;
  const att = DATA.attempts;
  const solved = (seat, lv) => new Set(att.filter(a => a.seat === seat && a.level === lv && a.correct).map(a => a.item)).size;
  const tiles = st.map(s => {
    const run = runs.find(r => r.seat === s.seat);
    const l3 = run ? (run.submitted_at ? `<span class="text-green-700 font-bold">${run.score} 分</span>` : '<span class="text-amber-600 font-bold">作答中</span>') : '<span class="text-slate-300">—</span>';
    const dot = (lv, total) => {
      const u = (s.unlocked || []).includes(lv), k = solved(s.seat, lv);
      const c = !u ? 'bg-slate-200 text-slate-400' : k >= total ? 'bg-green-500 text-white' : 'bg-sky-100 text-sky-800';
      return `<span class="inline-block rounded px-1 text-[11px] ${c}">${lv === 1 ? '一' : '二'} ${u ? `${k}/${total}` : '鎖'}</span>`;
    };
    return `<div class="bg-white rounded-xl border border-slate-200 p-2 text-center">
      <div class="text-xl font-black">${esc(s.seat)}</div><div class="text-[11px] text-slate-500 truncate">${esc(s.name || s.account)}</div><div class="text-[11px] text-sky-800 font-bold truncate">${s.nickname ? esc(s.nickname) : '&nbsp;'}</div>
      <div class="flex justify-center gap-1 mt-1">${dot(1, 6)}${dot(2, 5)}</div><div class="text-xs mt-1">三：${l3}</div></div>`;
  }).join('');
  return `<div class="grid grid-cols-2 md:grid-cols-5 gap-3 mb-4">
      ${stat('學生人數', n)}${stat('已解鎖第一關', unl(1), `/ ${n}`)}${stat('已解鎖第二關', unl(2), `/ ${n}`)}
      ${stat('第三關已交卷', done.length, `作答中 ${doing.length} 人`)}${stat('第三關平均', avg, '滿分 6')}</div>`
    + card('全班進度（數字是答對的題數；第一、二關的「鎖」表示還沒輸入授權碼）', `<div class="grid grid-cols-4 sm:grid-cols-6 md:grid-cols-10 gap-2">${tiles || '<p class="text-slate-400">還沒有學生資料。</p>'}</div>`);
}

function viewItems() {
  const lvSel = $('f-level').value;
  let html = '';
  const l3 = l3Stats();
  [1, 2, 3].filter(lv => !lvSel || String(lv) === lvSel).forEach(lv => {
    const worst = worst3(lv);
    const st = lv === 3 ? null : l12Stats(lv);
    const rows = ITEM_ORDER[lv].map(key => {
      if (lv === 3) return l3Row(+key - 1, l3, worst);
      const s = st[key], p = pct(s.first, s.people);
      const color = p >= 80 ? '#22c55e' : p >= 50 ? '#f59e0b' : '#ef4444';
      const top = s.tags.slice(0, 2).map(([t, c]) => `${esc(tagName(t))}（${c}）`).join('、') || '—';
      return `<tr class="border-b border-slate-100">
        <td>${esc(ITEM_NAMES[lv][key])}${worstBadge(worst, key)}</td><td class="text-center">${s.people}</td>
        <td class="min-w-[9rem]"><div class="flex items-center gap-2"><div class="bar flex-1"><span style="width:${p}%;background:${color}"></span></div><b class="w-10 text-right">${s.people ? p + '%' : '—'}</b></div></td>
        <td class="text-center">${s.people ? pct(s.eventually, s.people) + '%' : '—'}</td><td>${top}</td><td>${explainBtn(lv, key)}</td></tr>`;
    });
    const btn = worst.length ? `<button data-explain-worst="${lv}" class="ex-cta">▶ 講解錯最多的 ${worst.length} 題（${worst.map(k => itemShort(lv, k)).join('、')}）</button>` : '';
    const intro = lv === 3 ? `已交卷 ${l3.n} 人。` : `作答 ${new Set(filteredAttempts().filter(a => a.level === lv).map(a => a.seat)).size} 人。`;
    html += card(LEVEL_TITLE[lv], `<div class="flex flex-wrap items-center justify-between gap-2 mb-3"><p class="text-sm text-slate-500">${intro}紅色按鈕會依序播放答對率最低的 3 題；每題的「講解」只打開那一題。</p>${btn}</div>`
      + (lv === 3 ? table(['題目', '作答人數', '答對率', '最常見的錯誤（人數）', ''], rows)
                  : table(['題目', '作答人數', '一次答對率', '最後答對率', '最常見的錯誤（人數）', ''], rows)));
  });
  return `<p class="text-sm text-slate-500 mb-3">「一次答對率」看的是每位學生第一次作答的結果；第三關每人只作答一次。用上方的日期與時段篩選某一節課。</p>` + html;
}

const LEVEL_TITLE = { 1: '第一關：颱風定位', 2: '第二關：坐標翻譯機', 3: '第三關：象限挑戰' };

/* 第一、二關講解用的題目內容（與 index.html 的 L1_ITEMS、L2_ITEMS 對應）。

    R: { q: '把救生艇 R[3, 270°] 換成直角坐標 (x, y)。', ans: '(0, −3)', pt: [3, 270],

    T: { q: '救生筏 T 的直角坐標是 (−6, 8)，它離雷達站多遠？求 r。', ans: 'r = 10', pt: [10, 126.87], max: 10,

/* 第一、二關：每題的作答人數、一次答對、最後答對，以及每種錯誤有幾位學生犯過 */
function l12Stats(lv) {
  const att = filteredAttempts(), out = {};
  ITEM_ORDER[lv].forEach(key => {
    const bySeat = groupBy(att.filter(a => a.level === lv && String(a.item) === key), a => a.seat);
    let first = 0, eventually = 0;
    const tagSeats = new Map();
    bySeat.forEach(rs => {
      if (rs[0].correct) first++;
      if (rs.some(r => r.correct)) eventually++;
      new Set(rs.filter(r => !r.correct).map(r => r.tag || 'other')).forEach(t => tagSeats.set(t, (tagSeats.get(t) || 0) + 1));
    });
    out[key] = { people: bySeat.size, first, eventually, tags: [...tagSeats.entries()].sort((a, b) => b[1] - a[1]) };
  });
  return out;
}

/* 答對率最低的 3 題（全對的題目不列入；同分時照題目順序） */
function worst3(lv) {
  let list;
  if (lv === 3) {
    const st = l3Stats();
    if (!st.n) return [];
    list = st.items.map((s, i) => ({ k: String(i + 1), r: s.right / st.n }));
  } else {
    const st = l12Stats(lv);
    list = ITEM_ORDER[lv].filter(k => st[k].people).map(k => ({ k, r: st[k].first / st[k].people }));
  }
  return list.filter(x => x.r < 1).sort((a, b) => a.r - b.r).slice(0, 3).map(x => x.k);
}

/* ---------- 第三關：每個選項的人數 ---------- */
function l3Stats() {
  const seat = $('f-seat').value;
  const runs = (DATA.runs || []).filter(r => r.submitted_at && Array.isArray(r.answers) && (!seat || String(r.seat) === seat));
  return {
    n: runs.length,
    items: L3_Q.map((it, i) => {
      const count = it.opts.map((_, k) => runs.filter(r => r.answers[i] === k).length);
      return { count, blank: runs.length - count.reduce((a, b) => a + b, 0), right: count[0] };
    })
  };
}
/* 學生畫面上的雷達（只畫網格與目標點） */
function radarSvg(r, deg, maxR = 5) {
  const R0 = 110, S = R0 / maxR, C = R0 + 13, rad = deg * Math.PI / 180, px = C + r * S * Math.cos(rad), py = C - r * S * Math.sin(rad);
  let g = '';
  for (let a = 0; a < 360; a += 15) {
    const t = a * Math.PI / 180, o = a % 90 === 0 ? .45 : a % 30 === 0 ? .25 : .12;
    g += `<line x1="${C}" y1="${C}" x2="${C + R0 * Math.cos(t)}" y2="${C - R0 * Math.sin(t)}" stroke="rgba(14,116,144,${o})"/>`;
  }
  const step = maxR > 6 ? 2 : 1;
  for (let k = 1; k <= maxR; k++) {
    g += `<circle cx="${C}" cy="${C}" r="${k * S}" fill="none" stroke="rgba(14,116,144,.35)"/>`;
    if (k % step === 0) g += `<text x="${C + k * S}" y="${C + 13}" font-size="10" text-anchor="middle" fill="#0e7490">${k}</text>`;
  }
  g += `<line x1="${C}" y1="${C}" x2="${C + R0 + 9}" y2="${C}" stroke="#f59e0b" stroke-width="2.5"/>`;
  g += `<circle cx="${px}" cy="${py}" r="6" fill="#dc2626" stroke="#fff" stroke-width="2"/>`;
  return `<svg class="ex-radar" viewBox="0 0 ${2 * C} ${2 * C}" role="img" aria-label="雷達圖">${g}</svg>`;
}
function l3Row(i, st, worst) {
  const s = st.items[i], it = L3_Q[i], p = pct(s.right, st.n), key = String(i + 1);
  const color = p >= 80 ? '#22c55e' : p >= 50 ? '#f59e0b' : '#ef4444';
  const wrong = it.opts.map((o, k) => [o[1], s.count[k]]).slice(1).filter(x => x[1] > 0);
  if (s.blank) wrong.push(['未作答', s.blank]);
  const top = wrong.sort((a, b) => b[1] - a[1]).slice(0, 2).map(([t, c]) => `${esc(t)}（${c}）`).join('、') || '—';
  return `<tr class="border-b border-slate-100">
    <td>${esc(ITEM_NAMES[3][key])}${worstBadge(worst, key)}</td><td class="text-center">${st.n}</td>
    <td class="min-w-[9rem]"><div class="flex items-center gap-2"><div class="bar flex-1"><span style="width:${p}%;background:${color}"></span></div><b class="w-10 text-right">${st.n ? p + '%' : '—'}</b></div></td>
    <td>${top}</td><td>${explainBtn(3, key)}</td></tr>`;
}

/* ---------- 講解畫面（投影用） ----------
   list：這次要講的題目；紅色按鈕只放錯最多的 3 題，每題的「講解」只放那一題 */
const EX = { open: false, lv: 3, list: [], i: 0, reveal: false, worst: false };
function openExplain(lv, list, worst) {
  if (!list.length) return;
  Object.assign(EX, { open: true, lv, list, i: 0, reveal: false, worst: !!worst });
  renderExplain();
}
function closeExplain() { EX.open = false; const el = $('ex'); if (el) el.remove(); }
function renderExplain() {
  if (!EX.open || !DATA) return;
  let el = $('ex');
  if (!el) { el = document.createElement('div'); el.id = 'ex'; el.className = 'ex-wrap'; document.body.appendChild(el); }
  const key = EX.list[EX.i], lv = EX.lv;
  const body = lv === 3 ? explainL3(+key - 1) : explainL12(lv, key);
  const pos = EX.list.length > 1 ? `<div class="ex-pos">${EX.worst ? '錯最多' : ''} 第 ${EX.i + 1} / ${EX.list.length} 題</div>` : '';
  const nav = EX.list.length > 1 ? `<button data-ex="prev" ${EX.i === 0 ? 'disabled' : ''}>◀ 上一題</button><button data-ex="next" ${EX.i === EX.list.length - 1 ? 'disabled' : ''}>下一題 ▶</button>` : '';
  el.innerHTML = `<div class="ex-box">
    <div class="ex-head">
      <div class="ex-title">${esc(body.title)}</div>
      <div class="ex-meta">${body.meta}</div>
      <div class="ex-nav">${nav}<button data-ex="close">✕ 關閉</button></div>
    </div>${pos}
    ${body.html}
    ${EX.reveal ? `<div class="ex-sol"><div class="ex-sol-h">講解</div><ol>${body.sol.map(x => `<li>${esc(x)}</li>`).join('')}</ol></div>`
                : '<button data-ex="reveal" class="ex-reveal">公布正解（空白鍵）</button>'}
    <div class="ex-tip">鍵盤：${EX.list.length > 1 ? '← → 換題、' : ''}空白鍵公布正解、Esc 關閉。只顯示人數，不顯示學生姓名。</div>
  </div>`;
  el.querySelectorAll('[data-ex]').forEach(b => b.onclick = () => exAct(b.dataset.ex));
  el.onclick = e => { if (e.target === el) closeExplain(); };
}
function explainL3(q) {
  const st = l3Stats(), s = st.items[q], it = L3_Q[q], max = Math.max(1, ...s.count, s.blank);
  const opts = it.show.map((k, pos) => {
    const ok = k === 0, c = s.count[k], w = Math.round(c / max * 100);
    const cls = EX.reveal ? (ok ? 'ex-opt ex-ok' : 'ex-opt ex-no') : 'ex-opt';
    const note = EX.reveal ? (ok ? '<span class="ex-note ex-note-ok">✅ 正解</span>' : `<span class="ex-note">${esc(it.opts[k][1])}</span>`) : '';
    return `<div class="${cls}"><div class="ex-letter">${'ABCD'[pos]}</div><div class="ex-text">${esc(it.opts[k][0])}</div>
      <div class="ex-bar"><span style="width:${w}%"></span></div><div class="ex-count">${c} 人</div>${note}</div>`;
  }).join('');
  const blank = s.blank ? `<div class="ex-blank">未作答 ${s.blank} 人</div>` : '';
  const p = pct(s.right, st.n);
  return {
    title: `第三關 第 ${q + 1} 題`,
    meta: EX.reveal ? `答對率 ${st.n ? p + '%' : '—'}（${s.right} / ${st.n} 人）` : `已交卷 ${st.n} 人`,
    html: `<div class="ex-body">${it.pt ? radarSvg(it.pt[0], it.pt[1]) : ''}<div class="ex-main"><div class="ex-q">${esc(it.q)}</div><div class="ex-opts">${opts}</div>${blank}</div></div>`,
    sol: it.sol
  };
}
function explainL12(lv, key) {
  const it = L12_Q[lv][key], s = l12Stats(lv)[key], p = pct(s.first, s.people);
  const radar = it.showPt || EX.reveal ? radarSvg(it.pt[0], it.pt[1], it.max || 5) : '';
  const max = Math.max(1, ...s.tags.map(t => t[1]));
  const errs = s.tags.map(([t, c]) => `<div class="ex-opt ex-no ex-err"><div class="ex-text ex-err-name">${esc(tagName(t))}</div>
      <div class="ex-bar"><span style="width:${Math.round(c / max * 100)}%"></span></div><div class="ex-count">${c} 人</div></div>`).join('');
  const after = EX.reveal
    ? `<div class="ex-ans">正解：${esc(it.ans)}</div>
       <div class="ex-sub">答錯的同學犯了哪些錯（同一人只算一次）</div>
       <div class="ex-opts">${errs || '<div class="ex-blank">沒有人答錯。</div>'}</div>`
    : `<div class="ex-big">一次答對 <b>${s.first}</b> / ${s.people} 人</div>`;
  return {
    title: `${lv === 1 ? '第一關' : '第二關'} ${ITEM_NAMES[lv][key].split('：')[0]}`,
    meta: s.people ? `一次答對率 ${p}%・最後答對率 ${pct(s.eventually, s.people)}%` : '還沒有人作答',
    html: `<div class="ex-body">${radar}<div class="ex-main"><div class="ex-q">${esc(it.q)}</div>${after}</div></div>`,
    sol: it.sol
  };
}
function exAct(a) {
  if (a === 'close') return closeExplain();
  if (a === 'reveal') EX.reveal = true;
  if (a === 'prev' && EX.i > 0) { EX.i--; EX.reveal = false; }
  if (a === 'next' && EX.i < EX.list.length - 1) { EX.i++; EX.reveal = false; }
  renderExplain();
}
document.addEventListener('keydown', e => {
  if (!EX.open) return;
  if (e.key === 'Escape') exAct('close');
  else if (e.key === 'ArrowLeft') exAct('prev');
  else if (e.key === 'ArrowRight') exAct('next');
  else if (e.key === ' ') { e.preventDefault(); exAct('reveal'); }
});

function viewRank() {
  const seat = $('f-seat').value;
  const runs = DATA.runs.filter(r => !seat || String(r.seat) === seat);
  const done = runs.filter(r => r.submitted_at), doing = runs.filter(r => !r.submitted_at);
  let rank = 0, prev = null;
  const rows = done.map((r, i) => {
    const key = r.score + '|' + r.used_seconds; if (key !== prev) { rank = i + 1; prev = key; }
    const wrong = (r.answers || []).map((a, k) => a === 0 ? null : `${k + 1}${a == null ? '（未答）' : ''}`).filter(Boolean).join('、') || '全對';
    return `<tr class="border-b border-slate-100"><td class="text-center font-bold">${rank}</td><td class="text-center">${esc(r.seat)}</td><td>${esc(r.name)}</td><td>${nickCell(r.nickname)}</td>
      <td class="text-center font-bold">${r.score}</td><td class="text-center tabular-nums">${fmtSec(r.used_seconds)}</td>
      <td>${wrong}</td><td class="text-center">${r.auto ? '是' : ''}${r.late ? '（逾時）' : ''}</td><td>${fmtT(r.submitted_at)}</td>
      <td><button data-retake="${esc(r.seat)}" class="bg-red-50 hover:bg-red-100 text-red-700 font-bold rounded-lg px-2 py-1 text-xs">允許重考</button></td></tr>`;
  });
  const now = new Date(DATA.server_now).getTime();
  const lim = ((DATA.levels || []).find(l => l.level === 3) || {}).time_limit || 180;
  const rows2 = doing.map(r => {
    const left = lim - (now - new Date(r.started_at).getTime()) / 1000;
    return `<tr class="border-b border-slate-100"><td class="text-center">${esc(r.seat)}</td><td>${esc(r.name)}</td><td>${nickCell(r.nickname)}</td><td>${fmtT(r.started_at)}</td>
      <td class="text-center">${left > 0 ? '剩 ' + fmtSec(left) : '<span class="text-red-600">已超時，尚未送出</span>'}</td>
      <td><button data-retake="${esc(r.seat)}" class="bg-red-50 hover:bg-red-100 text-red-700 font-bold rounded-lg px-2 py-1 text-xs">允許重考</button></td></tr>`;
  });
  // 還沒開始作答第三關的學生
  const started = new Set(DATA.runs.map(r => r.seat));
  const notYet = (DATA.students || []).filter(s => !started.has(s.seat) && (!seat || String(s.seat) === seat));
  const rows3 = notYet.map(s => `<tr class="border-b border-slate-100"><td class="text-center">${esc(s.seat)}</td><td>${esc(s.name)}</td><td>${nickCell(s.nickname)}</td>
      <td>${(s.unlocked || []).includes(3) ? '已解鎖，還沒按開始' : '還沒輸入第三關授權碼'}</td><td>${s.logged_in ? '<span class="text-green-700 font-bold">登入中</span>' : '<span class="text-slate-400">未登入</span>'}</td></tr>`);
  const rest = card(`作答中（${doing.length} 人）`, table(['座號', '姓名', '暱稱', '開始時間', '狀態', ''], rows2))
    + card(`尚未作答（${notYet.length} 人）`, table(['座號', '姓名', '暱稱', '狀態', '登入狀態'], rows3))
    + '<p class="text-sm text-slate-500">「允許重考」會刪除該生的第三關紀錄，學生重新進入第三關即可再作答一次。</p>';
  if (RANK_TOP3) return viewTop3(done) + rest;
  const top3Btn = `<div class="flex flex-wrap items-center justify-between gap-2 mb-3"><p class="text-sm text-slate-500">要公布名次時，按右邊的按鈕切換成前三名的大字畫面。</p><button id="btn-top3" class="ex-cta">🏆 只顯示前三名</button></div>`;
  return card(`第三關排名（已交卷 ${done.length} 人；分數高者在前，同分比用時）`, top3Btn + table(['名次', '座號', '姓名', '暱稱', '分數', '用時', '答錯的題號', '時間到自動送出', '送出時間', ''], rows))
    + rest;
}

/* 前三名：座號、姓名、暱稱、分數、用時（不顯示答錯的題目）；同分同時的並列 */
function viewTop3(done) {
  let rank = 0, prev = null;
  const ranked = done.map((r, i) => { const k = r.score + '|' + r.used_seconds; if (k !== prev) { rank = i + 1; prev = k; } return { ...r, rank }; })
    .filter(r => r.rank <= 3);
  const medal = ['', '🥇', '🥈', '🥉'];
  const cards = ranked.map(r => `<div class="top3-card top3-${r.rank}">
      <div class="top3-medal">${medal[r.rank]}</div><div class="top3-rank">第 ${r.rank} 名</div>
      <div class="top3-name">${esc(r.seat)} 號　${esc(r.name || '')}</div>
      <div class="top3-nick">${r.nickname ? '暱稱：' + esc(r.nickname) : '（未取暱稱）'}</div>
      <div class="top3-score">${r.score} <span>/ ${L3_Q.length}</span></div><div class="top3-time">用時 ${fmtSec(r.used_seconds)}</div></div>`).join('');
  return `<section class="top3-wrap">
      <div class="top3-head"><h2>🏆 第三關前三名</h2><button id="btn-top3" class="top3-all">顯示全部排名</button></div>
      ${cards ? `<div class="top3-grid">${cards}</div>` : '<p class="top3-empty">還沒有人交卷。</p>'}
      <p class="top3-note">已交卷 ${done.length} 人。分數高者在前，同分比用時。</p>
    </section>`;
}

function viewLog() {
  const att = filteredAttempts().slice().reverse();
  const shown = att.slice(0, 500);
  const rows = shown.map(a => `<tr class="border-b border-slate-100 ${a.correct ? '' : 'bg-red-50/40'}">
    <td class="whitespace-nowrap">${fmtT(a.t)}</td><td class="text-center">${esc(a.seat)}</td><td>${nickCell(nickOf(a.seat))}</td><td class="text-center">${a.level}</td>
    <td>${esc((ITEM_NAMES[a.level] || {})[a.item] || a.item)}</td><td class="text-center">${a.correct ? '✅' : '❌'}</td>
    <td>${esc(tagName(a.tag))}</td><td class="text-center">${a.attempt || ''}</td><td class="text-xs text-slate-500">${esc(plain(a.answer))}</td></tr>`);
  return `<div class="flex items-center justify-between gap-3 mb-3 flex-wrap"><p class="text-sm text-slate-500">共 ${att.length} 筆${att.length > 500 ? '，畫面只顯示最新 500 筆，完整資料請匯出' : ''}。</p>
      <button id="btn-csv" class="bg-green-600 hover:bg-green-700 text-white font-bold rounded-lg px-4 py-2 text-sm">⬇️ 匯出 CSV（Excel 可開）</button></div>`
    + card('作答明細（最新在上）', table(['時間', '座號', '暱稱', '關卡', '題目', '對錯', '錯誤類型', '第幾次', '作答內容'], rows));
}

function viewStudents() {
  const rows = DATA.students.map(s => {
    const run = DATA.runs.find(r => r.seat === s.seat);
    return `<tr class="border-b border-slate-100"><td class="text-center font-bold">${esc(s.seat)}</td><td>${esc(s.account)}</td>
      <td class="font-mono">${showPw ? esc(s.password) : '••••••'}</td><td>${esc(s.name)}</td>
      <td><span class="whitespace-nowrap">${nickCell(s.nickname)}</span> <button data-nick="${esc(s.seat)}" data-cur="${esc(s.nickname || '')}" class="bg-slate-200 hover:bg-slate-300 font-bold rounded-lg px-2 py-1 text-xs">修改</button></td>
      <td>${(s.unlocked || []).map(l => '第' + ['', '一', '二', '三'][l] + '關').join('、') || '—'}</td>
      <td>${run ? (run.submitted_at ? run.score + ' 分' : '作答中') : '—'}</td>
      <td class="whitespace-nowrap">${s.logged_in ? `<span class="text-green-700 font-bold">登入中</span> <button data-kick="${esc(s.seat)}" class="bg-red-50 hover:bg-red-100 text-red-700 font-bold rounded-lg px-2 py-1 text-xs">強制登出</button>` : '<span class="text-slate-400">未登入</span>'}</td></tr>`;
  });
  return `<div class="flex items-center justify-between gap-3 mb-3 flex-wrap"><p class="text-sm text-slate-500">新增、修改帳號密碼請到 Supabase → Table Editor → students。<br>一個帳號同時只能在一台裝置登入；學生換裝置登不進去時，按「強制登出」。暱稱不恰當時按「修改」，清空就會讓學生重新取。</p>
      <button id="btn-pw" class="bg-slate-200 hover:bg-slate-300 font-bold rounded-lg px-3 py-2 text-sm">${showPw ? '隱藏密碼' : '顯示密碼'}</button></div>`
    + card(`學生名單（${DATA.students.length} 人）`, table(['座號', '帳號', '密碼', '姓名', '暱稱', '已解鎖', '第三關', '登入狀態'], rows));
}

function viewSettings() {
  const lv = DATA.levels || [], set = DATA.settings || {};
  const rows = lv.map(l => `<div class="flex flex-wrap items-end gap-3 py-2 border-b border-slate-100">
      <div class="w-40 font-bold">第${['', '一', '二', '三'][l.level]}關：${esc(l.title)}</div>
      <label class="flex flex-col gap-1 text-sm"><span class="text-slate-500">授權碼</span><input id="code-${l.level}" value="${esc(l.code)}" class="border border-slate-300 rounded-lg px-2 py-1.5 w-36 font-mono"></label>
      ${l.level === 3 ? `<label class="flex flex-col gap-1 text-sm"><span class="text-slate-500">作答時間（秒）</span><input id="limit-3" type="number" min="30" max="1800" value="${esc(l.time_limit || 180)}" class="border border-slate-300 rounded-lg px-2 py-1.5 w-28"></label>` : ''}
      <button data-save="${l.level}" class="bg-sky-600 hover:bg-sky-700 text-white font-bold rounded-lg px-3 py-2 text-sm">儲存</button></div>`).join('');
  const toggle = (key, label, desc) => {
    const on = set[key] === 'true';
    return `<div class="flex items-center justify-between gap-3 py-3 border-b border-slate-100"><div><div class="font-bold">${label}</div><div class="text-sm text-slate-500">${desc}</div></div>
      <button data-toggle="${key}" data-val="${on ? 'false' : 'true'}" class="shrink-0 font-bold rounded-full px-4 py-2 text-sm ${on ? 'bg-green-600 text-white' : 'bg-slate-200 text-slate-600'}">${on ? '開啟中' : '關閉中'}</button></div>`;
  };
  return card('關卡授權碼', rows + '<p class="text-sm text-slate-500 mt-2">修改後，已解鎖的學生不受影響；還沒解鎖的學生要輸入新的授權碼。</p>')
    + card('學生看得到的內容', toggle('show_leaderboard', '第三關排行榜', '學生在「任務總結」看得到前 10 名（只顯示座號）與自己的名次。')
      + toggle('reveal_answers', '第三關正解', '開啟後，學生在「任務總結」看得到答錯題目的正確指令。建議全班交卷後再開。'))
    + card('清除練習資料', `<p class="text-sm text-slate-600 mb-3">刪除所有作答紀錄、第三關成績、解鎖紀錄，並登出所有學生。學生帳號、授權碼、老師帳號都會保留。適合在試教練習之後、正式上課之前使用。</p>
      <div class="flex flex-wrap items-center gap-2"><input id="reset-confirm" placeholder="輸入「清除」" class="border border-slate-300 rounded-lg px-2 py-1.5 w-36">
      <button id="btn-reset" class="bg-red-600 hover:bg-red-700 text-white font-bold rounded-lg px-4 py-2 text-sm">清除練習資料</button></div>`, 'border-red-200');
}

/* ---------- 互動 ---------- */
function bindView() {
  document.querySelectorAll('[data-kick]').forEach(b => b.onclick = async () => {
    const seat = +b.dataset.kick;
    if (!confirm(`確定讓 ${seat} 號登出嗎？他正在用的裝置會被登出，之後可以在任何一台裝置重新登入。`)) return;
    try { const r = await rpc('admin_force_logout', { p_token: token(), p_seat: seat }); if (!r.ok) throw new Error('沒有權限'); refresh(); }
    catch (e) { alert(e.message); }
  });
  document.querySelectorAll('[data-nick]').forEach(b => b.onclick = async () => {
    const seat = +b.dataset.nick;
    const v = prompt(`${seat} 號的新暱稱（1～10 個字；清空表示讓學生重新取）：`, b.dataset.cur);
    if (v === null) return;
    try {
      const r = await rpc('admin_set_nickname', { p_token: token(), p_seat: seat, p_nickname: v });
      if (!r.ok) throw new Error(r.reason === 'taken' ? '這個暱稱已經有人用了。' : r.reason === 'invalid' ? '暱稱要 1～10 個字。' : '沒有權限');
      refresh();
    } catch (e) { alert(e.message); }
  });
  document.querySelectorAll('[data-explain]').forEach(b => b.onclick = () => {
    const [lv, key] = b.dataset.explain.split(':');
    openExplain(+lv, [key]);
  });
  document.querySelectorAll('[data-explain-worst]').forEach(b => b.onclick = () => { const lv = +b.dataset.explainWorst; openExplain(lv, worst3(lv), true); });
  const t3 = $('btn-top3');
  if (t3) t3.onclick = () => { RANK_TOP3 = !RANK_TOP3; render(); };
  renderExplain();   // 自動更新時，講解畫面的人數一起更新
  document.querySelectorAll('[data-retake]').forEach(b => b.onclick = async () => {
    const seat = +b.dataset.retake;
    if (!confirm(`確定讓 ${seat} 號重考第三關嗎？他目前的第三關成績會被刪除。`)) return;
    try { const r = await rpc('admin_allow_retake', { p_token: token(), p_seat: seat }); if (!r.ok) throw new Error('沒有權限'); refresh(); }
    catch (e) { alert(e.message); }
  });
  const csv = $('btn-csv');
  if (csv) csv.onclick = () => {
    const att = filteredAttempts();
    const cell = v => '"' + String(v == null ? '' : v).replace(/"/g, '""') + '"';
    const lines = [['時間', '座號', '暱稱', '關卡', '題目', '答對', '錯誤類型', '第幾次', '作答內容'].map(cell).join(',')]
      .concat(att.map(a => [fmtT(a.t), a.seat, nickOf(a.seat), a.level, (ITEM_NAMES[a.level] || {})[a.item] || a.item, a.correct ? '是' : '否', tagName(a.tag), a.attempt || '', plain(a.answer)].map(cell).join(',')));
    const blob = new Blob(['\ufeff' + lines.join('\r\n')], { type: 'text/csv;charset=utf-8' });
    const link = document.createElement('a');
    link.href = URL.createObjectURL(blob);
    link.download = `作答紀錄_${$('f-all').checked ? '全部' : $('f-date').value}.csv`;
    document.body.appendChild(link); link.click(); link.remove();
  };
  const pw = $('btn-pw');
  if (pw) pw.onclick = () => { showPw = !showPw; render(); };
  document.querySelectorAll('[data-save]').forEach(b => b.onclick = async () => {
    const lv = +b.dataset.save, code = $('code-' + lv).value.trim();
    const lim = lv === 3 ? parseInt($('limit-3').value, 10) : null;
    if (!code) return alert('授權碼不能空白。');
    try {
      const r = await rpc('admin_update_level', { p_token: token(), p_level: lv, p_code: code, p_time_limit: lim });
      if (!r.ok) throw new Error('儲存失敗');
      b.textContent = '已儲存 ✓'; setTimeout(() => refresh(), 600);
    } catch (e) { alert(e.message); }
  });
  document.querySelectorAll('[data-toggle]').forEach(b => b.onclick = async () => {
    try {
      const r = await rpc('admin_set_setting', { p_token: token(), p_key: b.dataset.toggle, p_value: b.dataset.val });
      if (!r.ok) throw new Error('儲存失敗');
      refresh();
    } catch (e) { alert(e.message); }
  });
  const rs = $('btn-reset');
  if (rs) rs.onclick = async () => {
    if ($('reset-confirm').value.trim() !== '清除') return alert('請在框內輸入「清除」兩個字。');
    if (!confirm('確定要清除所有練習資料嗎？這個動作無法復原。')) return;
    try {
      const r = await rpc('admin_reset', { p_token: token(), p_confirm: '清除' });
      if (!r.ok) throw new Error('清除失敗');
      alert('已清除。'); refresh();
    } catch (e) { alert(e.message); }
  };
}

/* ---------- 開始 ---------- */
/* 網站更新偵測：老師後台開著時網站更新了，就重新載入成新版 */
async function pageOutdated() {
  if (location.protocol === 'file:') return false;
  try {
    const r = await fetch(location.pathname + '?v=' + Date.now(), { method: 'HEAD', cache: 'no-store' });
    const lm = r.ok && r.headers.get('last-modified');
    if (!lm || new Date(lm).getTime() <= new Date(document.lastModified).getTime() + 2000) return false;
    const last = +sessionStorage.getItem('typhoon.adminReloadAt') || 0;
    if (Date.now() - last < 60000) return false;
    sessionStorage.setItem('typhoon.adminReloadAt', String(Date.now()));
    location.replace(location.pathname + '?r=' + Date.now());
    return true;
  } catch (e) { return false; }
}
document.addEventListener('visibilitychange', () => { if (document.visibilityState === 'visible') pageOutdated(); });

(async () => {
  if (await pageOutdated()) return;
  if (ONLINE && token()) refresh(true); else showLoginPage();
})();
</script>
