<script>

const DEFAULTS = {
  supabaseUrl: '', supabaseKey: '',
  level3Seconds: 180,
  revealLevel3AnswersAfterSubmit: false,
  demo: { codes: { 1: '1111', 2: '2222', 3: '3333' }, accounts: [{ account: 'demo', password: '1234', seat: 1, name: '示範工程師' }] }
};
const CONFIG = Object.assign({}, DEFAULTS, window.GAME_CONFIG || {});
CONFIG.demo = Object.assign({}, DEFAULTS.demo, CONFIG.demo || {});
const ONLINE = !!(CONFIG.supabaseUrl && CONFIG.supabaseKey);
/* 為什麼是示範模式：顯示在登入畫面，方便排除問題 */
function configProblem() {
  if (window.__configMissing) return '找不到 config.js。請確認它和 index.html 放在同一層，檔名全部小寫。';
  if (window.__configError) return 'config.js 格式有誤：' + window.__configError + '。最常見的原因是引號變成全形或彎引號（‘ ’），請改回半形直引號 \' \'。';
  if (!window.GAME_CONFIG) return 'config.js 有格式錯誤，所以沒有載入。最常見的原因是引號變成全形或彎引號（‘ ’），或少了逗號。';
  if (!CONFIG.supabaseUrl && !CONFIG.supabaseKey) return 'config.js 的 supabaseUrl 和 supabaseKey 都還是空的。';
  if (!CONFIG.supabaseUrl) return 'config.js 的 supabaseUrl 還是空的。';
  if (!CONFIG.supabaseKey) return 'config.js 的 supabaseKey 還是空的。';
  return '';
}

/* 瀏覽器儲存（登入狀態、第三關作答進度） */
const store = {
  get(k) { try { const v = localStorage.getItem(k); return v ? JSON.parse(v) : null; } catch (e) { return null; } },
  set(k, v) { try { localStorage.setItem(k, JSON.stringify(v)); } catch (e) {} },
  del(k) { try { localStorage.removeItem(k); } catch (e) {} }
};

/* 連線版：Supabase（帳號、授權碼、計時、計分都在伺服器） */
const RemoteAPI = {
  async rpc(name, body) {
    const headers = { 'Content-Type': 'application/json', apikey: CONFIG.supabaseKey };
    if (CONFIG.supabaseKey.startsWith('eyJ')) headers.Authorization = 'Bearer ' + CONFIG.supabaseKey;
    let res;
    try {
      res = await fetch(CONFIG.supabaseUrl.trim().replace(/\/+$/, '') + '/rest/v1/rpc/' + name, { method: 'POST', headers, body: JSON.stringify(body) });
    } catch (e) {
      const err = new Error('network'); err.kind = 'network'; throw err;
    }
    if (!res.ok) {
      const text = await res.text();
      let info = {}; try { info = JSON.parse(text); } catch (e) {}
      const err = new Error(text); err.kind = 'http'; err.status = res.status; err.code = info.code || ''; err.detail = info.message || info.msg || text;
      console.error('[Supabase]', name, res.status, text);
      throw err;
    }
    return res.json();
  },
  token() { return store.get('typhoon.token'); },
  async login(account, password) {
    const r = await this.rpc('game_login', { p_account: account, p_password: password });
    if (!r || !r.ok) return { ok: false, reason: r && r.reason };
    store.set('typhoon.token', r.token);
    return this.me();
  },
  setNickname(nick) { return this.rpc('game_set_nickname', { p_token: this.token(), p_nickname: nick }); },
  async me() {
    const t = this.token();
    if (!t) return { ok: false };
    const r = await this.rpc('game_me', { p_token: t });
    if (!r || !r.ok) store.del('typhoon.token');
    return r;
  },
  async logout() {   // 通知伺服器刪掉這台裝置的登入，才能在別台登入
    const t = this.token();
    store.del('typhoon.token');
    if (t) { try { await this.rpc('game_logout', { p_token: t }); } catch (e) {} }
  },
  unlock(level, code) { return this.rpc('game_unlock', { p_token: this.token(), p_level: level, p_code: code }); },
  log(e) {
    return this.rpc('game_log', { p_token: this.token(), p_level: e.level, p_item: String(e.item), p_answer: e.answer == null ? null : e.answer,
      p_correct: !!e.correct, p_tag: e.tag || null, p_attempt: e.attempt || null });
  },
  l3Start() { return this.rpc('game_l3_start', { p_token: this.token() }); },
  myResults() { return this.rpc('game_my_results', { p_token: this.token() }); },
  leaderboard() { return this.rpc('game_leaderboard', { p_token: this.token() }); },
  l3Submit(answers, auto) { return this.rpc('game_l3_submit', { p_token: this.token(), p_answers: answers, p_auto: !!auto }); }
};

/* 把連線錯誤翻成看得懂的原因（顯示在畫面上，方便排除問題） */
function explainError(e) {
  if (!ONLINE || !e) return '無法連上伺服器，請確認網路後再試一次。';
  const d = String(e.detail || '');
  if (e.kind === 'network') return '連不到 Supabase。請確認：① supabaseUrl 是 https://xxxx.supabase.co 的格式；② Supabase 專案沒有暫停（Paused）；③ 學校網路沒有擋 supabase.co。';
  if (e.code === '42501' || /permission denied/i.test(d)) return '函式沒有開放權限（' + (e.code || e.status) + '）。請重新執行一次 setup.sql。';
  if (e.status === 401 || /api key/i.test(d)) return '金鑰不正確（' + e.status + '）。請確認 supabaseKey 貼的是 Publishable key（sb_publishable_ 開頭）或 anon key，而且沒有多貼空白。';
  if (e.code === 'PGRST202' || (e.status === 404 && /function/i.test(d))) return '找不到資料庫函式（' + (e.code || e.status) + '）。請到 SQL Editor 重新執行 setup.sql，確認最後顯示 Success。';
  if (e.status === 404) return '網址不正確，或專案的 Data API 沒有開啟（404）。請確認 supabaseUrl，並到 Project Settings → Data API 檢查。';
  if (e.status >= 500) return 'Supabase 暫時沒有回應（' + e.status + '），專案可能剛恢復或正在啟動，請一分鐘後再試。';
  return '伺服器回應錯誤（' + (e.code || e.status) + '）：' + d.slice(0, 120);
}

/* 示範版：帳號與授權碼寫在 config.js，紀錄只存在這台裝置 */
const LocalAPI = {
  data() { return store.get('typhoon.demo') || { session: null, users: {} }; },
  save(d) { store.set('typhoon.demo', d); },
  acc(name) { return CONFIG.demo.accounts.find(a => String(a.account).toLowerCase() === String(name).trim().toLowerCase()); },
  user(d) { const a = d.session; d.users[a] = d.users[a] || { unlocked: [], l3: null }; return d.users[a]; },
  async login(account, password) {
    const a = this.acc(account);
    if (!a || String(a.password) !== String(password)) return { ok: false };
    const d = this.data(); d.session = a.account; this.user(d); this.save(d);
    return this.me();
  },
  async me() {
    const d = this.data(); if (!d.session) return { ok: false };
    const a = this.acc(d.session); if (!a) return { ok: false };
    const u = this.user(d);
    return { ok: true, account: a.account, seat: a.seat, name: a.name, nickname: u.nickname || null, unlocked: u.unlocked, l3: u.l3,
      server_now: new Date().toISOString(), time_limit: CONFIG.level3Seconds, role: 'student',
      show_leaderboard: true, reveal_answers: !!CONFIG.revealLevel3AnswersAfterSubmit };
  },
  async logout() { const d = this.data(); d.session = null; this.save(d); },
  async setNickname(nick) {
    const d = this.data(); if (!d.session) return { ok: false, reason: 'login' };
    const u = this.user(d);
    if (u.nickname) return { ok: false, reason: 'locked', nickname: u.nickname };
    const v = String(nick || '').replace(/[\u0000-\u001f\u007f]/g, '').trim();
    if (v.length < 1 || [...v].length > 10) return { ok: false, reason: 'invalid' };
    if (Object.entries(d.users).some(([k, o]) => k !== d.session && o.nickname && o.nickname.toLowerCase() === v.toLowerCase())) return { ok: false, reason: 'taken' };
    u.nickname = v; this.save(d);
    return { ok: true, nickname: v };
  },
  async unlock(level, code) {
    const ok = String(CONFIG.demo.codes[level] || '').toLowerCase() === String(code).trim().toLowerCase();
    if (ok) { const d = this.data(); const u = this.user(d); if (!u.unlocked.includes(level)) u.unlocked.push(level); this.save(d); }
    return { ok };
  },
  async log(e) {
    const d = this.data(), u = this.user(d);
    u.attempts = (u.attempts || []).concat([{ level: e.level, item: String(e.item), correct: !!e.correct, attempt: e.attempt || null, tag: e.tag || null }]).slice(-500);
    this.save(d); return { ok: true };
  },
  async myResults() {
    const d = this.data(), u = this.user(d);
    return { ok: true, attempts: u.attempts || [], l3: u.l3 && u.l3.submitted ? { answers: u.l3.answers, score: u.l3.score, used_seconds: u.l3.used_seconds, submitted: true } : null,
      reveal: !!CONFIG.revealLevel3AnswersAfterSubmit };
  },
  async leaderboard() {
    const d = this.data(), u = this.user(d), a = this.acc(d.session);
    const me = u.l3 && u.l3.submitted ? { rank: 1, nickname: u.nickname || '（未取暱稱）', score: u.l3.score, used_seconds: u.l3.used_seconds } : null;
    return { ok: true, show: true, total: me ? 1 : 0, top: me ? [{ ...me, is_me: true }] : [], me };
  },
  async l3Start() {
    const d = this.data(), u = this.user(d);
    if (!u.unlocked.includes(3)) return { ok: false, reason: 'locked' };
    if (!u.l3) { u.l3 = { started_at: new Date().toISOString(), submitted: false }; this.save(d); }
    return { ok: true, started_at: u.l3.started_at, server_now: new Date().toISOString(), submitted: u.l3.submitted, score: u.l3.score, used_seconds: u.l3.used_seconds };
  },
  async l3Submit(answers, auto) {
    const d = this.data(), u = this.user(d);
    if (!u.l3) return { ok: false, reason: 'not_started' };
    if (!u.l3.submitted) {
      const used = Math.min((Date.now() - new Date(u.l3.started_at).getTime()) / 1000, CONFIG.level3Seconds);
      Object.assign(u.l3, { submitted: true, answers, score: answers.filter(a => a === 0).length, used_seconds: Math.round(used * 10) / 10, auto: !!auto });
      this.save(d);
    }
    return { ok: true, score: u.l3.score, used_seconds: u.l3.used_seconds };
  }
};
const API = ONLINE ? RemoteAPI : LocalAPI;

/* 作答紀錄：送到資料庫；暫時連不上時先排隊，下一次再補送 */
const GAME_LOG = [];
const pendingLogs = [];
function report(evt) {
  evt.ts = new Date().toISOString();
  GAME_LOG.push(evt);
  console.log('[作答紀錄]', evt);
  if (evt.type || evt.level == null || evt.item == null) return;
  pendingLogs.push(evt);
  flushLogs();
}
let flushing = false;
async function flushLogs() {
  if (flushing) return; flushing = true;
  try {
    while (pendingLogs.length) { await API.log(pendingLogs[0]); pendingLogs.shift(); }
  } catch (e) { setTimeout(flushLogs, 5000); }
  finally { flushing = false; }
}

function typeset(el) {
  const mj = window.MathJax;
  if (!mj || !mj.startup || !mj.startup.promise) { setTimeout(() => typeset(el), 300); return; }
  mj.startup.promise.then(() => mj.typesetPromise([el])).catch(() => {});
}

function parseVal(s) {
  if (!s) return NaN;
  s = s.replace(/−/g, '-').replace(/\s/g, '');
  const m = s.match(/^([+-]?)(\d+(?:\.\d+)?|\.\d+)?(√(\d+(?:\.\d+)?))?$/);
  if (!m || (!m[2] && !m[3])) return NaN;
  const sign = m[1] === '-' ? -1 : 1;
  const coef = m[2] ? parseFloat(m[2]) : 1;
  const root = m[3] ? Math.sqrt(parseFloat(m[4])) : 1;
  return sign * coef * root;
}

/* 第三關時間的中文說法，例如 180 → 三分鐘、150 → 兩分三十秒、90 → 一分三十秒 */
function timeText(sec) {
  sec = Math.max(1, Math.round(sec || 180));
  const zh = n => {
    const d = ['零', '一', '二', '三', '四', '五', '六', '七', '八', '九'];
    if (n < 10) return d[n];
    if (n < 20) return '十' + (n % 10 ? d[n % 10] : '');
    return d[Math.floor(n / 10)] + '十' + (n % 10 ? d[n % 10] : '');
  };
  const m = Math.floor(sec / 60), s = sec % 60;
  const mm = m === 2 ? '兩' : zh(m);
  if (m && !s) return mm + '分鐘';
  if (!m) return zh(s) + '秒';
  return mm + '分' + zh(s) + '秒';
}

function fmtTime(ms) {
  const s = Math.max(0, Math.ceil(ms / 1000));
  return Math.floor(s / 60) + ':' + String(s % 60).padStart(2, '0');
}

function bubble(msg, delay) {
  const s = SPEAKERS[msg.who];
  const style = delay != null ? `style="animation-delay:${delay}s"` : '';
  const avatar = `<div class="w-10 h-10 rounded-full bg-slate-700 flex items-center justify-center text-xl shadow-lg shrink-0 border-2 ${s.right ? 'border-sky-500' : 'border-red-500'} ${msg.cont ? 'opacity-0' : ''}">${msg.cont ? '' : s.emoji}</div>`;
  const nameLine = msg.cont ? '' : `<p class="${s.right ? 'text-sky-300 text-right' : 'text-red-400'} font-bold mb-1 text-xs tracking-wider">${s.name}</p>`;
  const box = s.right ? 'bg-sky-900/60 border-sky-700 rounded-tr-none' : 'bg-slate-700/80 border-slate-600 rounded-tl-none';
  return `<div class="chat-bubble flex items-start gap-3 ${s.right ? 'flex-row-reverse' : ''}" ${style}>${avatar}<div class="${box} p-3 md:p-4 rounded-2xl border shadow-md"><div>${nameLine}<p class="text-white leading-relaxed">${msg.html}</p></div></div></div>`;
}
function bubbles(list, base = 0.4, step = 1.5) {
  return list.map((m, i) => bubble(m, base + i * step)).join('');
}

function showScreen(el) { el.classList.remove('hidden', 'fade-out'); el.classList.add('flex'); }

/* 網站更新偵測：GitHub Pages 更新後，還開著的舊分頁會繼續跑舊程式（例如登出不會通知伺服器）。
   比對這一頁的 Last-Modified 和伺服器上最新的版本，不同就重新載入（第三關作答中除外）。 */
const PageUpdate = {
  async latest() {
    try {
      const r = await fetch(location.pathname + '?v=' + Date.now(), { method: 'HEAD', cache: 'no-store' });
      const lm = r.ok && r.headers.get('last-modified');
      return lm ? new Date(lm).getTime() : null;
    } catch (e) { return null; }
  },
  async check() {
    if (location.protocol === 'file:' || (typeof L3 !== 'undefined' && L3.inProgress())) return false;
    const mine = new Date(document.lastModified).getTime(), now = await this.latest();
    if (!now || !mine || now <= mine + 2000) return false;
    let last = 0; try { last = +sessionStorage.getItem('typhoon.reloadAt') || 0; } catch (e) {}
    if (Date.now() - last < 60000) return false;          // 一分鐘內最多重新載入一次，避免 CDN 還沒更新時一直重整
    try { sessionStorage.setItem('typhoon.reloadAt', String(Date.now())); } catch (e) {}
    location.replace(location.pathname + '?r=' + Date.now());
    return true;
  }
};
document.addEventListener('visibilitychange', () => { if (document.visibilityState === 'visible') PageUpdate.check(); });

async function boot() {

  try {

    if (me && me.ok) { $('login-status').textContent = ''; $('btn-login').disabled = false; onLoggedIn(me); return; }
    showLogin();
  } catch (e) {
    showLogin(explainError(e));
  }
}

function itemStatus(rows) {
  if (!rows.length) return { icon: '⚪', text: '未作答', cls: 'text-slate-400' };
  const k = rows.findIndex(r => r.correct);
  if (k === 0) return { icon: '✅', text: '一次答對', cls: 'text-green-300' };
  if (k > 0 && k < 3) return { icon: '🟡', text: `第 ${k + 1} 次答對`, cls: 'text-amber-300' };
  return { icon: '❌', text: k >= 3 ? '看了答案，重玩後答對' : '看了答案', cls: 'text-red-300' };
}

async function loadSummary() {
  $('sum-who').textContent = whoText(state.user);
  const body = $('sum-body');
  body.innerHTML = '<p class="text-slate-400 text-center py-6">讀取中……</p>';
  let res, lb;
  try {
    [res, lb] = await Promise.all([API.myResults(), API.leaderboard()]);
  } catch (e) {
    body.innerHTML = `<p class="text-red-300 text-center py-6">${explainError(e)}</p>`;
    return;
  }
  if ((res && res.reason === 'login') || (lb && lb.reason === 'login')) { forceLogin('登入已過期，請重新登入。'); return; }
  const att = (res && res.attempts) || [];
  const rowsOf = (lv, key) => att.filter(a => a.level === lv && String(a.item) === String(key));
  const box = (title, inner) => `<section class="bg-slate-900/60 border border-slate-600 rounded-2xl p-4"><h3 class="font-bold text-sky-200 mb-3">${title}</h3>${inner}</section>`;

  // 第三關成績
  const l3 = res && res.l3;
  let l3html;
  if (l3 && l3.submitted) {
    const me = lb && lb.me;
    const rankTxt = lb && lb.show && me && me.rank ? `第 <b class="text-2xl text-amber-300">${me.rank}</b> 名 / 共 ${lb.total} 人` : (lb && !lb.show ? '名次：老師還沒公布' : '');
    l3html = `<div class="flex items-end justify-between gap-3 flex-wrap">
        <div><div class="text-slate-400 text-xs">第三關分數</div><div class="text-4xl font-black">${l3.score} <span class="text-lg text-slate-400">/ ${L3_ITEMS.length}</span></div></div>
        <div class="text-right"><div class="text-slate-400 text-xs">用時 ${fmtTime((l3.used_seconds || 0) * 1000)}</div><div class="text-slate-200">${rankTxt}</div></div>
      </div>`;
  } else {
    l3html = '<p class="text-slate-400">第三關還沒有完成，完成後這裡會顯示分數與名次。</p>';
  }
  let html = box('🏁 第三關成績', l3html);

  // 排行榜
  if (lb && lb.show) {
    const esc = v => String(v == null ? '' : v).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
    const rows = (lb.top || []).map(r => `<tr class="${r.is_me ? 'bg-sky-700/60 font-bold' : 'border-t border-slate-700'}">
        <td class="py-1.5 px-2 text-center">${r.rank}</td><td class="px-2 text-center">${esc(r.nickname)}${r.is_me ? '（你）' : ''}</td>
        <td class="px-2 text-center">${r.score}</td><td class="px-2 text-center tabular-nums">${fmtTime((r.used_seconds || 0) * 1000)}</td></tr>`).join('');
    const meOut = lb.me && !(lb.top || []).some(r => r.is_me) ? `<p class="text-sm text-sky-200 mt-2">你的名次：第 ${lb.me.rank} 名（${lb.me.score} 分，${fmtTime((lb.me.used_seconds || 0) * 1000)}）</p>` : '';
    html += box('🏆 第三關排行榜（前 10 名）', rows
      ? `<div class="overflow-x-auto"><table class="w-full text-sm"><thead><tr class="text-slate-400 text-xs"><th class="pb-1">名次</th><th class="pb-1">暱稱</th><th class="pb-1">分數</th><th class="pb-1">用時</th></tr></thead><tbody>${rows}</tbody></table></div>${meOut}`
      : '<p class="text-slate-400">還沒有人完成第三關。</p>');
  } else {
    html += box('🏆 第三關排行榜', '<p class="text-slate-400">老師還沒公布排行榜。</p>');
  }

  // 每題對錯
  const list = items => `<ul class="space-y-1.5">${items.join('')}</ul>`;
  const li = (name, st, extra = '') => `<li class="flex items-start justify-between gap-3"><span>${st.icon} ${name}${extra}</span><span class="${st.cls} shrink-0 text-sm">${st.text}</span></li>`;
  html += box('🌀 第一關：颱風定位', list(L1_ITEMS.map(it => li(it.name, itemStatus(rowsOf(1, it.key))))));
  html += box('🚁 第二關：坐標翻譯機', list(L2_ITEMS.map(it => li(it.name, itemStatus(rowsOf(2, it.key))))));
  let l3items;
  if (l3 && l3.submitted && Array.isArray(l3.answers)) {
    l3items = L3_ITEMS.map((it, i) => {
      const a = l3.answers[i], opt = a == null ? null : it.opts[a], ok = !!(opt && opt.ok);
      const st = a == null ? { icon: '⚪', text: '未作答', cls: 'text-slate-400' } : ok ? { icon: '✅', text: '答對', cls: 'text-green-300' } : { icon: '❌', text: '答錯', cls: 'text-red-300' };
      let extra = `<div class="text-xs text-slate-300 mt-0.5 ml-6">你的指令：${opt ? M(opt.t) : '—'}`;
      if (!ok && res.reveal) extra += `　正確指令：${M(it.opts.find(o => o.ok).t)}`;
      extra += '</div>';
      return li(`撤離點 ${i + 1}`, st, extra);
    });
    if (!res.reveal) l3items.push('<li class="text-xs text-slate-400 pt-1">正確指令會在老師公布後顯示在這裡。</li>');
  } else {
    l3items = ['<li class="text-slate-400">第三關還沒有完成。</li>'];
  }
  html += box('📍 第三關：象限挑戰', list(l3items));
  body.innerHTML = html;
  typeset(body);
}

/* =========================================================
   雷達畫布
   ========================================================= */
const canvas = $('radar'), ctx = canvas.getContext('2d');
let W = 0, H = 0, DPR = 1;
let pickEnabled = false, onPick = null;
const view = { maxR: 5, axes: false, polarHint: true, land: true, station: true };
const scene = { objects: [], marker: null, ghost: null, tri: null, anim: null };

/* 台灣海岸輪廓（以花蓮為極點，1 格 = 35 公里，示意用） */
const LAND = [[0.4,3.6],[0.6,3.35],[0.25,2.6],[0.3,1.8],[0.1,0.9],[0,0],[-0.45,-1.4],[-0.9,-2.8],[-1.3,-4.0],[-1.75,-5.4],[-2.2,-6.7],[-2.5,-6.0],[-2.75,-5.2],[-3.8,-4.4],[-4.15,-3.2],[-4.25,-1.9],[-3.6,0.2],[-3.0,1.0],[-2.1,2.3],[-1.3,3.1],[-0.6,3.6]];

function resizeCanvas() {
  const r = $('stage').getBoundingClientRect();
  DPR = Math.min(window.devicePixelRatio || 1, 2);
  W = r.width; H = r.height;
  canvas.width = Math.round(W * DPR); canvas.height = Math.round(H * DPR);
  ctx.setTransform(DPR, 0, 0, DPR, 0, 0);
}
new ResizeObserver(() => { if (!$('main-app').classList.contains('hidden')) resizeCanvas(); }).observe($('stage'));

function geom() {
  const ox = W / 2, oy = H / 2 + 12;
  const sc = (Math.min(W, H - 24) / 2) * 0.82 / view.maxR;
  return { ox, oy, sc };
}

function pill(text, x, y, opt = {}) {
  ctx.font = `${opt.bold ? '700' : '500'} ${opt.size || 12}px 'Noto Sans TC', sans-serif`;
  const w = ctx.measureText(text).width + 10, h = (opt.size || 12) + 8;
  const rx = x - w / 2, ry = y - h / 2, rad = 6;
  ctx.fillStyle = opt.bg || 'rgba(15,23,42,0.85)';
  ctx.beginPath();
  ctx.moveTo(rx + rad, ry); ctx.lineTo(rx + w - rad, ry); ctx.quadraticCurveTo(rx + w, ry, rx + w, ry + rad);
  ctx.lineTo(rx + w, ry + h - rad); ctx.quadraticCurveTo(rx + w, ry + h, rx + w - rad, ry + h);
  ctx.lineTo(rx + rad, ry + h); ctx.quadraticCurveTo(rx, ry + h, rx, ry + h - rad);
  ctx.lineTo(rx, ry + rad); ctx.quadraticCurveTo(rx, ry, rx + rad, ry); ctx.fill();
  ctx.fillStyle = opt.color || '#fff'; ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
  ctx.fillText(text, x, y + 0.5);
}
function emoji(ch, x, y, size = 24) {
  ctx.font = `${size}px "Apple Color Emoji","Segoe UI Emoji","Noto Color Emoji",sans-serif`;
  ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
  ctx.fillText(ch, x, y);
}
function arrowHead(x1, y1, x2, y2, size, color) {
  const a = Math.atan2(y2 - y1, x2 - x1);
  ctx.fillStyle = color; ctx.beginPath();
  ctx.moveTo(x2, y2);
  ctx.lineTo(x2 - size * Math.cos(a - 0.45), y2 - size * Math.sin(a - 0.45));
  ctx.lineTo(x2 - size * Math.cos(a + 0.45), y2 - size * Math.sin(a + 0.45));
  ctx.closePath(); ctx.fill();
}

function draw(t) {
  const { ox, oy, sc } = geom();
  const P = (x, y) => [ox + x * sc, oy - y * sc];
  const maxR = view.maxR, deg = Math.PI / 180;
  ctx.clearRect(0, 0, W, H);

  const bg = ctx.createRadialGradient(ox, oy, 0, ox, oy, Math.max(W, H) * 0.75);
  bg.addColorStop(0, '#0c2a47'); bg.addColorStop(1, '#020617');
  ctx.fillStyle = bg; ctx.fillRect(0, 0, W, H);

  // 陸地
  if (view.land) {
    ctx.beginPath();
    LAND.forEach(([x, y], i) => { const [px, py] = P(x, y); i ? ctx.lineTo(px, py) : ctx.moveTo(px, py); });
    ctx.closePath();
    ctx.fillStyle = 'rgba(52,96,74,0.55)'; ctx.fill();
    ctx.strokeStyle = 'rgba(134,239,172,0.45)'; ctx.lineWidth = 1.5; ctx.stroke();
    if (maxR <= 6) { const [lx, ly] = P(-2.5, -1.2); ctx.fillStyle = 'rgba(187,247,208,0.35)'; ctx.font = "700 14px 'Noto Sans TC'"; ctx.textAlign = 'center'; ctx.fillText('台灣', lx, ly); }
  }

  // 放射線（每 15°）
  for (let a = 0; a < 360; a += 15) {
    const alpha = a % 90 === 0 ? 0.3 : a % 30 === 0 ? 0.15 : 0.07;
    const [ex, ey] = P(maxR * Math.cos(a * deg), maxR * Math.sin(a * deg));
    ctx.strokeStyle = `rgba(56,189,248,${alpha})`; ctx.lineWidth = 1;
    ctx.beginPath(); ctx.moveTo(ox, oy); ctx.lineTo(ex, ey); ctx.stroke();
  }
  // 同心圓
  for (let r = 1; r <= maxR; r++) {
    ctx.strokeStyle = `rgba(56,189,248,${r === maxR ? 0.45 : 0.25})`; ctx.lineWidth = 1;
    ctx.beginPath(); ctx.arc(ox, oy, r * sc, 0, 2 * Math.PI); ctx.stroke();
  }

  // 掃描
  if (!reduceMotion) {
    const ang = (t / 5000 * 2 * Math.PI) % (2 * Math.PI), d = 0.035;
    for (let k = 0; k < 22; k++) {
      ctx.fillStyle = `rgba(56,189,248,${0.16 * (1 - k / 22)})`;
      ctx.beginPath(); ctx.moveTo(ox, oy);
      ctx.arc(ox, oy, maxR * sc, -ang + k * d, -ang + (k + 1) * d);
      ctx.closePath(); ctx.fill();
    }
  }

  // 直角坐標軸
  if (view.axes) {
    ctx.strokeStyle = 'rgba(255,255,255,0.6)'; ctx.lineWidth = 1.5;
    const [x1, y1] = P(-maxR - 0.3, 0), [x2, y2] = P(maxR + 0.3, 0);
    const [x3, y3] = P(0, -maxR - 0.3), [x4, y4] = P(0, maxR + 0.3);
    ctx.beginPath(); ctx.moveTo(x1, y1); ctx.lineTo(x2, y2); ctx.moveTo(x3, y3); ctx.lineTo(x4, y4); ctx.stroke();
    arrowHead(x3, y3, x4, y4, 9, 'rgba(255,255,255,0.75)');
    ctx.font = "italic 700 15px 'Times New Roman', serif"; ctx.fillStyle = '#fff'; ctx.textAlign = 'left';
    ctx.fillText('y', x4 + 8, y4 + 6);
    ctx.fillText('x', x2 - 4, y2 + 18);
  }

  // 同心圓刻度（沿極軸）
  const step = maxR > 6 ? 2 : 1;
  for (let r = step; r <= maxR; r += step) {
    const [lx, ly] = P(r, 0);
    ctx.fillStyle = 'rgba(186,230,253,0.9)'; ctx.font = "600 11px 'Noto Sans TC'"; ctx.textAlign = 'center'; ctx.textBaseline = 'top';
    ctx.fillText(String(r), lx, ly + 4);
  }
  ctx.textBaseline = 'alphabetic';

  // 極軸
  {
    const [ax, ay] = P(maxR + 0.35, 0);
    ctx.strokeStyle = '#fbbf24'; ctx.lineWidth = 2.5;
    ctx.beginPath(); ctx.moveTo(ox, oy); ctx.lineTo(ax, ay); ctx.stroke();
    arrowHead(ox, oy, ax, ay, 10, '#fbbf24');
    if (!view.axes) pill('極軸 0°', ax - 26, ay - 16, { color: '#fde68a', size: 11 });
  }

  // 方位
  {
    const pad = 0.62;
    const dirs = [['北', 0, maxR + pad], ['南', 0, -maxR - pad], ['西', -maxR - pad, 0], ['東', maxR + pad, -0.55]];
    ctx.font = "700 12px 'Noto Sans TC'"; ctx.fillStyle = 'rgba(148,163,184,0.95)'; ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
    dirs.forEach(([s, x, y]) => { const [px, py] = P(x, y); ctx.fillText(s, px, py); });
    ctx.textBaseline = 'alphabetic';
  }

  // 逆時針提示
  if (view.polarHint) {
    const rr = 0.7 * sc;
    ctx.strokeStyle = '#fbbf24'; ctx.lineWidth = 2;
    ctx.beginPath(); ctx.arc(ox, oy, rr, 0, -75 * deg, true); ctx.stroke();
    const ex = ox + rr * Math.cos(75 * deg), ey = oy - rr * Math.sin(75 * deg);
    const px = ox + rr * Math.cos(68 * deg), py = oy - rr * Math.sin(68 * deg);
    arrowHead(px, py, ex, ey, 8, '#fbbf24');
    pill('逆時針', ox + rr * 1.25 * Math.cos(38 * deg) + 14, oy - rr * 1.25 * Math.sin(38 * deg), { color: '#fde68a', size: 11 });
  }

  // 直角三角形（第二關）
  if (scene.tri) drawTriangle(P, sc);

  // 已知目標
  scene.objects.forEach(o => {
    const [px, py] = P(o.x, o.y);
    if (o.blink) {
      const k = (Math.sin(t / 250) + 1) / 2;
      ctx.strokeStyle = `rgba(248,113,113,${0.4 + 0.6 * k})`; ctx.lineWidth = 2;
      ctx.beginPath(); ctx.arc(px, py, 16 + 6 * k, 0, 2 * Math.PI); ctx.stroke();
    }
    emoji(o.emoji, px, py + (o.dy || 0), o.size || 24);
    if (o.label) pill(o.label, px, py + 24, { size: 11 });
  });

  // 正解提示
  if (scene.ghost) {
    const [px, py] = P(scene.ghost.x, scene.ghost.y);
    ctx.setLineDash([5, 4]); ctx.strokeStyle = '#4ade80'; ctx.lineWidth = 2.5;
    ctx.beginPath(); ctx.arc(px, py, 18, 0, 2 * Math.PI); ctx.stroke(); ctx.setLineDash([]);
    pill('正確位置', px, py - 28, { color: '#bbf7d0', size: 11 });
  }

  // 玩家標記
  if (scene.marker) {
    const m = scene.marker;
    const [px, py] = P(m.r * Math.cos(m.th * deg), m.r * Math.sin(m.th * deg));
    ctx.setLineDash([6, 5]); ctx.strokeStyle = '#fb923c'; ctx.lineWidth = 2;
    ctx.beginPath(); ctx.moveTo(ox, oy); ctx.lineTo(px, py); ctx.stroke(); ctx.setLineDash([]);
    if (m.th > 0) {
      ctx.strokeStyle = 'rgba(251,146,60,0.85)'; ctx.lineWidth = 2;
      ctx.beginPath(); ctx.arc(ox, oy, 0.45 * sc, 0, -m.th * deg, true); ctx.stroke();
    }
    const k = (Math.sin(t / 200) + 1) / 2;
    ctx.strokeStyle = '#fb923c'; ctx.lineWidth = 2.5;
    ctx.beginPath(); ctx.arc(px, py, 10 + 3 * k, 0, 2 * Math.PI); ctx.stroke();
    ctx.beginPath(); ctx.moveTo(px - 16, py); ctx.lineTo(px + 16, py); ctx.moveTo(px, py - 16); ctx.lineTo(px, py + 16); ctx.stroke();
  }

  // 同界角動畫
  if (scene.anim) {
    const a = scene.anim;
    if (!a.t0) a.t0 = t;
    const p = Math.min(1, (t - a.t0) / a.dur);
    const end = a.to * p;
    ctx.strokeStyle = '#facc15'; ctx.lineWidth = 3; ctx.beginPath();
    for (let phi = 0; phi <= end; phi += 3) {
      const rr = a.r * (0.3 + 0.7 * phi / a.to);
      const [px, py] = P(rr * Math.cos(phi * deg), rr * Math.sin(phi * deg));
      phi ? ctx.lineTo(px, py) : ctx.moveTo(px, py);
    }
    ctx.stroke();
    if (p >= 1) { const [px, py] = P(a.r * Math.cos(a.to * deg), a.r * Math.sin(a.to * deg)); pill('30° 與 390° 是同一點', px, py - 34, { color: '#fef08a', size: 12, bold: true }); }
  }

  // 雷達站
  if (view.station) {
    const g = ctx.createRadialGradient(ox, oy, 0, ox, oy, 14);
    g.addColorStop(0, 'rgba(125,211,252,1)'); g.addColorStop(1, 'rgba(125,211,252,0)');
    ctx.fillStyle = g; ctx.beginPath(); ctx.arc(ox, oy, 14, 0, 2 * Math.PI); ctx.fill();
    ctx.fillStyle = '#e0f2fe'; ctx.beginPath(); ctx.arc(ox, oy, 4, 0, 2 * Math.PI); ctx.fill();
    if (state.level === 1) pill('花蓮雷達站', ox - 34, oy + 18, { size: 10, color: '#bae6fd' });
  }
}

/* 把標籤放在錨點的某一側，pill 的邊緣離錨點 gap 像素 */
function pillSide(text, ax, ay, dx, dy, gap, opt) {
  const size = opt.size || 12;
  ctx.font = `${opt.bold ? '700' : '500'} ${size}px 'Noto Sans TC', sans-serif`;
  const w = ctx.measureText(text).width + 10, h = size + 8;
  const L = Math.hypot(dx, dy) || 1; dx /= L; dy /= L;
  const ext = Math.abs(dx) * w / 2 + Math.abs(dy) * h / 2;
  pill(text, ax + dx * (gap + ext), ay + dy * (gap + ext), opt);
}

function drawTriangle(P, sc) {
  const T = scene.tri, deg = Math.PI / 180;
  const [ox, oy] = P(0, 0), [fx, fy] = P(T.x, 0), [px, py] = P(T.x, T.y);
  const fs = W < 500 ? 12 : 13;
  const onAxis = Math.abs(T.x) < 0.01;
  ctx.fillStyle = 'rgba(59,130,246,0.22)';
  ctx.beginPath(); ctx.moveTo(ox, oy); ctx.lineTo(fx, fy); ctx.lineTo(px, py); ctx.closePath(); ctx.fill();
  // x 邊
  ctx.strokeStyle = '#f472b6'; ctx.lineWidth = 3.5;
  ctx.beginPath(); ctx.moveTo(ox, oy); ctx.lineTo(fx, fy); ctx.stroke();
  // y 邊（垂足虛線）
  ctx.setLineDash([7, 5]); ctx.strokeStyle = '#a3e635'; ctx.lineWidth = 3;
  ctx.beginPath(); ctx.moveTo(fx, fy); ctx.lineTo(px, py); ctx.stroke(); ctx.setLineDash([]);
  // 斜邊 r
  ctx.strokeStyle = '#38bdf8'; ctx.lineWidth = 3.5;
  ctx.beginPath(); ctx.moveTo(ox, oy); ctx.lineTo(px, py); ctx.stroke();
  // 直角記號
  if (!onAxis && Math.abs(T.y) > 0.01) {
    const s = 10, dx = T.x > 0 ? -s : s, dy = T.y > 0 ? -s : s;
    ctx.strokeStyle = 'rgba(255,255,255,0.8)'; ctx.lineWidth = 1.5;
    ctx.beginPath(); ctx.moveTo(fx + dx, fy); ctx.lineTo(fx + dx, fy + dy); ctx.lineTo(fx, fy + dy); ctx.stroke();
  }
  // θ 弧：只標一個 θ，數值寫在左下角的說明
  if (T.th != null) {
    const rr = 0.5 * sc;
    ctx.strokeStyle = '#fbbf24'; ctx.lineWidth = 2.5;
    ctx.beginPath(); ctx.arc(ox, oy, rr, 0, -T.th * deg, true); ctx.stroke();
    const mid = T.th / 2 * deg, lr = rr + 11;
    ctx.font = "italic 700 16px 'Times New Roman', serif"; ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
    ctx.lineWidth = 3; ctx.strokeStyle = 'rgba(2,6,23,0.9)';
    ctx.strokeText('θ', ox + lr * Math.cos(mid), oy - lr * Math.sin(mid));
    ctx.fillStyle = '#fde68a'; ctx.fillText('θ', ox + lr * Math.cos(mid), oy - lr * Math.sin(mid));
    ctx.textBaseline = 'alphabetic';
  }
  const below = T.y >= 0 ? 1 : -1;   // 畫布座標：三角形在 x 軸上方時，x 標籤放下方
  const side = T.x >= 0 ? 1 : -1;
  // x 標籤：放在 x 邊外側（三角形的另一邊）
  if (!onAxis) pillSide(`x = ${T.xs}`, (ox + fx) / 2, oy, 0, below, 6, { color: '#fbcfe8', size: fs, bold: true });
  else pillSide(`x = ${T.xs}`, ox, oy, 1, below * 0.9, 8, { color: '#fbcfe8', size: fs, bold: true });
  // y 標籤：放在垂足虛線外側（遠離極點那一邊）
  if (Math.abs(T.y) > 0.01) pillSide(`y = ${T.ys}`, fx, (fy + py) / 2, onAxis ? 1 : side, 0, 8, { color: '#d9f99d', size: fs, bold: true });
  // r 標籤：放在斜邊外側（遠離垂足那一邊）
  const hx = (ox + px) / 2, hy = (oy + py) / 2;
  let nx, ny;
  if (onAxis) { nx = -1; ny = 0; }
  else {
    nx = -(py - oy); ny = (px - ox);
    if (nx * (hx - fx) + ny * (hy - fy) < 0) { nx = -nx; ny = -ny; }
  }
  pillSide(`r = ${T.rs}`, hx, hy, nx, ny, 8, { color: '#bae6fd', size: fs, bold: true });
  // 點
  ctx.fillStyle = '#fff'; ctx.beginPath(); ctx.arc(px, py, 5, 0, 2 * Math.PI); ctx.fill();
}

function frame(t) {
  if (!$('main-app').classList.contains('hidden') && W > 0) draw(t);
  requestAnimationFrame(frame);
}
requestAnimationFrame(frame);

/* 點選雷達（第一關） */
let dragging = false;
function pick(e) {
  const rect = canvas.getBoundingClientRect();
  const { ox, oy, sc } = geom();
  const x = (e.clientX - rect.left - ox) / sc, y = (oy - (e.clientY - rect.top)) / sc;
  const dist = Math.hypot(x, y);
  if (dist < 0.4) return;
  const r = Math.max(1, Math.min(view.maxR, Math.round(dist)));
  const th = mod360(Math.round((Math.atan2(y, x) * 180 / Math.PI) / 15) * 15);
  scene.marker = { r, th };
  if (onPick) onPick(scene.marker);
}
canvas.addEventListener('pointerdown', e => { if (!pickEnabled) return; dragging = true; canvas.setPointerCapture(e.pointerId); pick(e); });
canvas.addEventListener('pointermove', e => { if (dragging && pickEnabled) pick(e); });
canvas.addEventListener('pointerup', () => { dragging = false; });
canvas.addEventListener('pointercancel', () => { dragging = false; });

/* =========================================================
   狀態與面板
   ========================================================= */
function setStatus(text, tone = 'idle') {
  const box = $('status-box'), el = $('status-text');
  el.textContent = text;
  const tones = {
    idle: ['border-transparent', 'text-slate-800'],
    ok: ['border-green-500', 'text-green-600'],
    bad: ['border-red-500', 'text-red-600'],
    warn: ['border-amber-400', 'text-amber-600']
  };
  box.classList.remove('border-transparent', 'border-green-500', 'border-red-500', 'border-amber-400');
  el.classList.remove('text-slate-800', 'text-green-600', 'text-red-600', 'text-amber-600');
  box.classList.add(tones[tone][0]); el.classList.add(tones[tone][1]);
}
function setPanel(title, sub) { $('panel-title').textContent = title; $('panel-sub').textContent = sub; }
function progressDots(total, cur) {
  let h = '<div class="flex items-center gap-1.5 text-xs text-slate-500 font-bold"><span class="mr-1">任務進度</span>';
  for (let i = 0; i < total; i++) {
    const c = i < cur ? 'bg-green-500' : i === cur ? 'bg-sky-500 ring-2 ring-sky-200' : 'bg-slate-300';
    h += `<span class="w-2.5 h-2.5 rounded-full ${c}"></span>`;
  }
  return h + `<span class="ml-1">${Math.min(cur + 1, total)} / ${total}</span></div>`;
}
function feedback(html, tone) {
  const fb = $('fb');
  const tones = {
    ok: 'bg-green-50 border border-green-300 text-green-800',
    bad: 'bg-red-50 border border-red-300 text-red-800',
    warn: 'bg-amber-50 border border-amber-300 text-amber-800',
    info: 'bg-slate-50 border border-slate-300 text-slate-700'
  };
  fb.className = 'mt-3 p-3 rounded-lg text-sm leading-relaxed ' + tones[tone];
  fb.innerHTML = html;
  typeset(fb);
  fb.scrollIntoView({ behavior: 'smooth', block: 'nearest' });
}

/* ---------- 數字鍵盤 ---------- */
const KP = { active: null, fields: {}, onSubmit: null };
function kpSetup(sqrt, onSubmit) {
  KP.fields = {}; KP.active = null; KP.onSubmit = onSubmit;
  document.querySelectorAll('.kp-field').forEach(b => {
    KP.fields[b.dataset.f] = '';
    b.onclick = () => kpFocus(b.dataset.f);
  });
  const keys = ['1', '2', '3', '4', '5', '⌫', '6', '7', '8', '9', '0', '±', '.', sqrt ? '√' : '', 'C', 'GO'];
  const kp = $('keypad');
  kp.innerHTML = keys.map(k => {
    if (k === '') return '<span></span>';
    if (k === 'GO') return '<button data-k="GO" class="kp-key col-span-2 bg-sky-600 active:bg-sky-700 text-white font-bold rounded-lg text-base">送出</button>';
    if (k === 'C') return '<button data-k="C" class="kp-key bg-slate-300 active:bg-slate-400 text-slate-700 font-bold rounded-lg text-sm">清除</button>';
    const special = ['⌫', '±', '√'].includes(k);
    return `<button data-k="${k}" class="kp-key ${special ? 'bg-slate-200 text-sky-700' : 'bg-white text-slate-800'} active:bg-sky-100 border border-slate-300 font-bold rounded-lg text-lg">${k}</button>`;
  }).join('');
  kp.querySelectorAll('button').forEach(b => b.onclick = () => kpPress(b.dataset.k));
  kp.classList.remove('hidden');
  const first = document.querySelector('.kp-field');
  if (first) { kpFocus(first.dataset.f); setTimeout(() => first.scrollIntoView({ block: 'nearest' }), 80); }
}
function kpHide() { $('keypad').classList.add('hidden'); KP.active = null; }
function kpFocus(f) {
  KP.active = f;
  document.querySelectorAll('.kp-field').forEach(b => {
    const on = b.dataset.f === f;
    b.classList.toggle('border-sky-500', on); b.classList.toggle('bg-sky-50', on); b.classList.toggle('border-slate-300', !on);
  });
}
function kpPress(k) {
  if (k === 'GO') { if (KP.onSubmit) KP.onSubmit(); return; }
  if (!KP.active) return;
  let v = KP.fields[KP.active] || '';
  if (k === '⌫') v = v.slice(0, -1);
  else if (k === 'C') v = '';
  else if (k === '±') v = v.startsWith('−') ? v.slice(1) : '−' + v;
  else if (v.length < 8) v += k;
  KP.fields[KP.active] = v;
  const b = document.querySelector(`.kp-field[data-f="${KP.active}"]`);
  if (b) b.textContent = v || '　';
}
document.addEventListener('keydown', e => {
  if ($('keypad').classList.contains('hidden') || $('main-app').classList.contains('hidden')) return;
  if (document.activeElement && document.activeElement.tagName === 'INPUT') return;
  const map = { Backspace: '⌫', '-': '±', Enter: 'GO', '.': '.' };
  if (/^[0-9]$/.test(e.key)) kpPress(e.key);
  else if (map[e.key]) { e.preventDefault(); kpPress(map[e.key]); }
  else if (e.key === 'Tab') {
    e.preventDefault();
    const fs = Object.keys(KP.fields); const i = fs.indexOf(KP.active);
    kpFocus(fs[(i + 1) % fs.length]);
  }
});
function fieldBtn(f, unit) {
  return `<span class="inline-flex items-center gap-1"><button data-f="${f}" class="kp-field min-w-[4.5rem] h-10 px-2 bg-white border-2 border-slate-300 rounded-lg text-lg font-bold text-sky-800 text-center">　</button>${unit ? `<span class="text-sm text-slate-600">${unit}</span>` : ''}</span>`;
}

/* =========================================================
   第一關：颱風定位
   ========================================================= */
const L1_ITEMS = [   // 四個任務，與紙本學習單「任務紀錄」的順序相同
  { kind: 'tap', key: 'A', name: '漁船', emoji: '🚢', r: 3, th: 60, title: '任務 1：定位漁船',

    desc: '颱風中心已經標在雷達上（閃爍的 🌀）。請回報它離雷達站幾格，以及從極軸轉了幾度（逆時針記正、順時針記負）。',
    modal: { who: 'cmd', title: '緊急通訊：指揮官 簡大哥', html: '工程師，氣象署剛傳來颱風中心的最新位置！<br>請立刻用<strong class="text-red-400">雷達的方式</strong>回報，讓所有船隻知道颱風在哪裡。' } },
  { kind: 'tap', key: 'S', name: '補給船', emoji: '⛴️', r: 2, th: 30, title: '任務 3：定位補給船',

  { kind: 'tap', key: 'H', name: '救難直升機', emoji: '🚁', r: 2, th: 390, title: '任務 4：盤旋的直升機',
    desc: '救難直升機從雷達站上空出發，沿著極軸方向，<b>逆時針</b>繞著雷達站飛了<b>一圈又 30°</b>（一共轉了 390°），最後停在離雷達站 <b>2 格</b>的地方。請點出直升機現在的位置。',
    modal: { who: 'intel', title: '緊急通訊：情報官 阿程', html: '工程師，救難直升機在雷達站上空盤旋，等待降落指示。<br>它已經逆時針繞了 <strong class="text-sky-300">390°</strong>，請你判斷它現在停在哪裡。' } }
];

const L1 = {
  init() {
    state.level = 1;
    Object.assign(view, { maxR: 5, axes: false, polarHint: true, land: true, station: true });
    Object.assign(scene, { objects: [], marker: null, ghost: null, tri: null, anim: null });
    $('btn-restart').classList.remove('hidden');
    $('stage-timer').classList.add('hidden');
    $('legend').innerHTML = '極軸指向正東<br>逆時針記正、順時針記負';
    setPanel('🌀 颱風危機：颱風定位', '用「距離」和「方向」找出位置');
    this.idx = 0; this.records = []; this.placed = [];
    this.startItem();
  },
  startItem() {
    const it = L1_ITEMS[this.idx];
    if (it.modal) showMissionModal(it.modal, () => this.beginItem());
    else this.beginItem();
  },
  beginItem() {
    const it = L1_ITEMS[this.idx];
    this.attempts = 0; this.done = false;
    scene.marker = null; scene.ghost = null; scene.anim = null;
    scene.objects = [...this.placed];
    if (it.kind === 'read') scene.objects.push({ ...this.pos(it), emoji: it.emoji, label: it.name, blink: true });
    pickEnabled = it.kind === 'tap';
    $('main-app').dataset.lv = it.kind;
    onPick = it.kind === 'tap' ? m => {
      $('mk-info').textContent = `已標記：距離 ${m.r} 格`;
      $('btn-submit').disabled = false;
    } : null;
    setStatus(`等待定位：${it.name}`);
    this.render();
  },
  pos(it) { const a = it.th * Math.PI / 180; return { x: it.r * Math.cos(a), y: it.r * Math.sin(a) }; },
  placedObj(it) { return it.key === 'H' ? { ...this.pos(it), emoji: it.emoji, dy: -26, size: 22 } : { ...this.pos(it), emoji: it.emoji, label: it.name }; },
  render() {
    const it = L1_ITEMS[this.idx];
    $('panel-data').innerHTML = progressDots(L1_ITEMS.length, this.idx);
    const hint = it.kind === 'tap'
      ? '先找到黃色的極軸（正東），從那裡開始逆時針轉到指定角度，再沿著那個方向數格數，每一圈是 1 格。雷達上的細線每 15° 一條。'
      : '先數它在第幾圈，再從極軸開始量角度：逆時針轉記正角，順時針轉記負角（例如順時針轉 15° 記作 −15°）。雷達上的細線每 15° 一條。' + (it.km ? '最後記得換算成公里：1 格 = 35 公里。' : '');
    let body;
    if (it.kind === 'tap') {
      body = `<div class="bg-white rounded-lg p-3 text-sm flex justify-between items-center border border-sky-100">
          <span class="text-slate-500">目前標記</span><span id="mk-info" class="font-bold text-orange-600">尚未標記，請點雷達畫面</span></div>
        <button id="btn-submit" disabled class="${btnMain}">📍 確認標記位置</button>`;
    } else {
      body = `<div class="bg-white rounded-lg p-2.5 text-sm border border-sky-100 flex flex-wrap items-center justify-around gap-x-4 gap-y-2">
          <span class="inline-flex items-center gap-1.5"><span class="text-slate-600">距離</span>${fieldBtn('d', it.km ? '公里' : '格')}</span>
          <span class="inline-flex items-center gap-1.5"><span class="text-slate-600">轉了</span>${fieldBtn('a', '度')}</span>
        </div>
        <button id="btn-submit" class="${btnMain} kp-dup">📡 回報位置</button>`;
    }
    $('tasks').innerHTML = `
      <section class="bg-sky-50 p-4 rounded-xl border border-sky-200">
        <div class="flex justify-between items-center mb-2 gap-2">
          <h2 class="font-bold text-sky-900 text-base">${it.emoji} ${it.title}</h2>
          <button id="btn-hint" class="text-amber-600 hover:text-amber-700 text-sm font-bold shrink-0 px-2 py-1 -mr-2 rounded-lg active:bg-amber-100">💡 提示</button>
        </div>
        <p class="text-sm text-slate-700 mb-3 leading-relaxed">${it.desc}</p>
        <div id="hint-box" class="hidden mb-3 bg-amber-50 border border-amber-200 text-amber-800 p-3 rounded-lg text-sm">${hint}</div>
        ${body}
        <p id="fb" class="hidden"></p>
        <button id="btn-next" class="${btnNext}">${this.idx === L1_ITEMS.length - 1 ? '📞 回報指揮中心' : '接收新狀況：下一個任務 ➡️'}</button>
      </section>`;
    $('btn-hint').onclick = () => $('hint-box').classList.toggle('hidden');
    $('btn-submit').onclick = () => it.kind === 'tap' ? this.checkTap() : this.checkRead();
    $('btn-next').onclick = () => this.next();
    if (it.kind === 'read') kpSetup(false, () => this.checkRead()); else kpHide();
  },
  checkTap() {
    if (this.done || !scene.marker) return;
    const it = L1_ITEMS[this.idx], m = scene.marker, t = mod360(it.th);
    this.attempts++;
    if (m.r === it.r && m.th === t) {
      return this.success(`距離 ${it.r} 格，角度 ${it.th}°`, 'ok', { r: m.r, th: m.th });
    }
    let msg, tag;
    if (m.r === it.r && m.th === mod360(90 - t)) { tag = 'north_cw'; msg = '你是從<b>正北</b>開始、<b>順時針</b>量的嗎？那是生活中的方位角。雷達的角度要從<b>極軸（正東）</b>開始，<b>逆時針</b>量。'; }
    else if (m.r === it.r && m.th === mod360(-t)) { tag = 'clockwise'; msg = '方向轉反了！角度要從極軸<b>逆時針</b>轉，也就是先往北方（上方）轉。'; }
    else if (m.r !== it.r && m.th === t) { tag = 'distance'; msg = '方向對了！距離再數一次：從雷達站往外，每一圈是 1 格。'; }
    else { tag = 'other'; msg = '還差一點。先從黃色的極軸（正東）開始逆時針轉到指定角度，再沿著那個方向數格數。'; }
    this.fail(msg, tag, { r: m.r, th: m.th });
  },
  checkRead() {
    if (this.done) return;
    const it = L1_ITEMS[this.idx];
    const d = parseVal(KP.fields.d), a = parseVal(KP.fields.a);
    if (isNaN(d) || isNaN(a)) { feedback('請先填完距離和角度，再回報。', 'info'); return; }
    this.attempts++;
    const dT = it.km ? it.r * 35 : it.r, t = it.th, am = mod360(a);
    const dOk = near(d, dT), aOk = near(am, t);
    const inRange = a > -180 - 0.01 && a < 360 - 0.01;   // 手冊：溝通用的角度範圍 −180° 到 360°
    if (dOk && aOk && inRange) {
      const neg = t - 360;   // 終邊在第三、四象限：正角、負角都可以
      const note = a < 0
        ? `${KP.fields.a}° 代表從極軸<b>順時針</b>轉 ${Math.abs(a)}°，也可以說成逆時針轉 ${t}°，兩種說法都對。`
        : (t > 180 ? `也可以說成從極軸<b>順時針</b>轉 ${-neg}°，記作 ${neg}°，兩種說法都對。` : '');
      return this.success(`距離 ${dT} ${it.km ? '公里' : '格'}，角度 ${KP.fields.a}°`, a < 0 ? 'negative_angle' : 'ok', { d, a }, note);
    }
    if (dOk && aOk && !inRange) {
      this.fail('方向對了，但轉超過一圈了。不必多繞，用 −180° 到 360° 之間的角度回報就好。', 'over_turn', { d, a });
      return;
    }
    const msgs = []; let tag = '';
    if (!dOk) {
      if (it.km && near(d, it.r)) { tag = 'km_unit'; msgs.push('你回報的是<b>格數</b>。1 格 = 35 公里，請換算成公里。'); }
      else { tag = 'distance'; msgs.push('距離再數一次：每一圈是 1 格。' + (it.km ? '最後記得換算成公里。' : '')); }
    }
    if (!aOk) {
      if (near(am, mod360(90 - t))) { tag = tag || 'north_cw'; msgs.push(`${KP.fields.a}° 是從<b>正北順時針</b>量的方位角。雷達的角度要從<b>極軸（正東）</b>開始量：逆時針記正、順時針記負。`); }
      else if (near(am, mod360(-t))) { tag = tag || 'mirror'; msgs.push('看看目標在極軸的<b>上方還是下方</b>？逆時針轉記正角，順時針轉記負角。'); }
      else { tag = tag || 'angle'; msgs.push('角度再檢查一次：從極軸開始量，逆時針記正、順時針記負，細線每 15° 一條。'); }
    }
    this.fail(msgs.join('<br>'), tag, { d, a });
  },
  success(text, tag, answer, extra = '') {
    const it = L1_ITEMS[this.idx];
    this.done = true; pickEnabled = false;
    report({ level: 1, item: it.key, answer, correct: true, tag, attempt: this.attempts });
    this.records.push({ name: it.name, text });
    this.placed.push(this.placedObj(it));
    scene.objects = [...this.placed];
    scene.marker = null;
    let msg = `✅ <b>定位成功！</b>${it.name}：${text}。`;
    if (it.key === 'H') {
      scene.anim = { t0: 0, dur: 1800, to: 390, r: 2 };
      msg = '✅ <b>定位成功！</b>直升機繞了 390°，剛好停在<b>補給船的正上方</b>，和任務 3 是同一個位置！';
    }
    if (extra) msg += '<br>💡 ' + extra;
    feedback(msg, 'ok');
    setStatus('定位成功', 'ok');
    $('btn-submit').classList.add('hidden');
    $('btn-next').classList.remove('hidden');
    kpHide();
  },
  fail(msg, tag, answer) {
    const it = L1_ITEMS[this.idx];
    report({ level: 1, item: it.key, answer, correct: false, tag, attempt: this.attempts });
    if (this.attempts >= 3) {
      this.done = true; pickEnabled = false;
      const p = this.pos(it); scene.ghost = p;
      const ans = it.km ? `距離 ${it.r * 35} 公里，角度 ${it.th}°` : `距離 ${it.r} 格，角度 ${it.th}°`;
      this.records.push({ name: it.name, text: ans + '（看提示）' });
      this.placed.push(this.placedObj(it));
      feedback(`${msg}<br><br>正確答案：<b>${ans}</b>，已用綠色虛線標出。看看它和你的答案差在哪裡，再前往下一個任務。`, 'warn');
      setStatus('已顯示正確位置', 'warn');
      $('btn-submit').classList.add('hidden');
      $('btn-next').classList.remove('hidden');
      kpHide();
    } else {
      const extra = this.attempts === 2 ? '<br>💡 提示：極軸是黃色箭頭（正東）；逆時針就是先往上（北方）轉。' : '';
      feedback(`❌ ${msg}${extra}`, 'bad');
      setStatus('定位偏差，請再試一次', 'bad');
    }
  },
  next() {
    this.idx++;
    if (this.idx >= L1_ITEMS.length) { kpHide(); pickEnabled = false; showOutro(1); }
    else this.startItem();
  }
};

const L2 = {

        <p class="text-xs text-slate-500 mt-2">答案都是整數；負數先按 ± 鍵（鍵盤可以直接打 −）。</p>
        <button id="btn-submit" class="${btnMain} kp-dup">🚁 傳送給直升機</button>`;
      hint = '看雷達上的直角三角形：藍色斜邊是 r，粉紅色躺在 x 軸上的那邊是 x，綠色虛線（往 x 軸作的垂線）是 y。想想 cosθ、sinθ 和 x、y、r 的關係。';
    } else {
      desc = `救生筏的 GPS 回報 ${M(it.rect)}。雷達站要知道它離雷達站多遠，請算出 ${M('r')}（可以用計算機搭配畢氏定理）。`;
      body = `<div class="bg-white rounded-lg p-3 border border-sky-100 flex items-center justify-center gap-2 text-lg font-bold text-slate-700">
          <span>${M('r')} =</span>${fieldBtn('r')}</div>
        <button id="btn-submit" class="${btnMain} kp-dup">📡 傳送給雷達站</button>`;
      hint = '雷達上的直角三角形，兩股長是 |x| 和 |y|，r 是斜邊。';
    }
    $('tasks').innerHTML = `
      <section class="bg-sky-50 p-4 rounded-xl border border-sky-200">
        <div class="flex justify-between items-center mb-2 gap-2">
          <h2 class="font-bold text-sky-900 text-base">${it.emoji} 任務 ${this.idx + 1}：${it.kind === 'p2r' ? '翻譯' : '算出'}${it.name}${it.kind === 'p2r' ? '的位置' : '的距離'}</h2>
          <button id="btn-hint" class="text-amber-600 hover:text-amber-700 text-sm font-bold shrink-0 px-2 py-1 -mr-2 rounded-lg active:bg-amber-100">💡 提示</button>
        </div>
        <p class="text-sm text-slate-700 mb-3 leading-relaxed">${desc}</p>
        <div id="hint-box" class="hidden mb-3 bg-amber-50 border border-amber-200 text-amber-800 p-3 rounded-lg text-sm">${hint}</div>
        ${body}
        <p id="fb" class="hidden"></p>
        <button id="btn-next" class="${btnNext}">${this.idx === L2_ITEMS.length - 1 ? '📞 回報指揮中心' : '接收新狀況：下一個任務 ➡️'}</button>
      </section>`;
    $('btn-hint').onclick = () => $('hint-box').classList.toggle('hidden');
    $('btn-submit').onclick = () => this.check();
    $('btn-next').onclick = () => this.next();
    kpSetup(true, () => this.check());
    typeset($('tasks'));
  },
  check() {
    if (this.done) return;
    const it = L2_ITEMS[this.idx];
    let ok, msg = '', tag = 'other', answer;
    if (it.kind === 'p2r') {
      const x = parseVal(KP.fields.x), y = parseVal(KP.fields.y);
      if (isNaN(x) || isNaN(y)) { feedback('請把 x 和 y 都填好。', 'info'); return; }
      answer = { x: KP.fields.x, y: KP.fields.y };
      this.attempts++;
      ok = near(x, it.x) && near(y, it.y);
      if (!ok) {
        const swap = near(x, it.y) && near(y, it.x);
        const absOk = near(Math.abs(x), Math.abs(it.x)) && near(Math.abs(y), Math.abs(it.y));
        if (it.key === 'R' && (swap || absOk || (near(Math.abs(x), 3) && near(y, 0)))) { tag = 'axis'; msg = '救生艇 R 落在哪一條軸上？想想 x、y 哪一個是 0，另一個是正還是負。'; }
        else if (swap) { tag = 'swap'; msg = 'x、y 對調了。x 是三角形躺在 x 軸上的那一邊，y 是直立的那一邊。'; }
        else if (absOk) { tag = 'sign'; msg = `數字大小對了，符號再檢查一次：${it.name}在第幾象限？x、y 應該是正還是負？`; }
        else { msg = '看看雷達上的直角三角形：斜邊是 r，躺在 x 軸上的那邊是 x，直立的那邊是 y。'; }
        if (this.attempts === 2) msg += `<br>💡 提示：還記得 ${M(R`\cos\theta = \dfrac{x}{r}`)}、${M(R`\sin\theta = \dfrac{y}{r}`)} 嗎？`;
      }
    } else {
      const r = parseVal(KP.fields.r);
      if (isNaN(r)) { feedback('請先填好 r，再傳送。', 'info'); return; }
      answer = { r: KP.fields.r };
      this.attempts++;
      ok = near(r, it.r);
      if (!ok) {
        if (near(r, it.x + it.y) || near(r, Math.abs(it.x) + Math.abs(it.y))) { tag = 'add'; msg = '把 x 和 y 直接相加不是距離喔！r 是直角三角形的斜邊。'; }
        else if (near(r, it.x * it.x + it.y * it.y)) { tag = 'no_sqrt'; msg = '快完成了！算出平方和之後，別忘了開根號。'; }
        else if (r < 0) { tag = 'negative'; msg = 'r 是距離，一定不會是負的。'; }
        else { msg = '畫出直角三角形：兩股長是 |x| 和 |y|，r 是斜邊。'; }
        if (this.attempts === 2) msg += `<br>💡 提示：畢氏定理 ${M('r^2 = x^2 + y^2')}`;
      }
    }
    report({ level: 2, item: it.key, answer, correct: ok, tag: ok ? 'ok' : tag, attempt: this.attempts });
    if (ok) return this.finishItem(true);
    if (this.attempts >= 3) return this.finishItem(false, msg);
    feedback('❌ ' + msg, 'bad');
    setStatus('翻譯錯誤，請再試一次', 'bad');
  },
  finishItem(ok, msg) {
    const it = L2_ITEMS[this.idx];
    this.done = true;
    let rec;
    if (it.kind === 'p2r') {
      scene.tri.xs = it.xs; scene.tri.ys = it.ys;
      rec = { name: it.name, polar: it.polar.replace(/^[A-Z]/, ''), rect: `(${it.xt},\\ ${it.yt})` };
    } else {
      scene.tri.rs = String(it.r);
      rec = { name: it.name, polar: `r = ${it.r}`, rect: it.rect.replace(/^[A-Z]/, '') };
    }
    this.records.push(rec);
    const ansTex = it.kind === 'p2r' ? `(x,y) = (${it.xt},\\ ${it.yt})` : `r = ${it.r}`;
    const slope = it.kind === 'p2r'
      ? `<br>💡 ${M(`x = ${it.r} \\times \\left(${it.cosT}\\right) = ${it.xt}`)}、${M(`y = ${it.r} \\times \\left(${it.sinT}\\right) = ${it.yt}`)}，也就是 ${M('x = r\\cos\\theta')}、${M('y = r\\sin\\theta')}。`
      : `<br>💡 ${M(`r = \\sqrt{${it.x < 0 ? `(${it.x})` : it.x}^2 + ${it.y < 0 ? `(${it.y})` : it.y}^2} = ${it.r}`)}，也就是 ${M('r = \\sqrt{x^2 + y^2}')}。`;
    if (ok) { feedback(`✅ <b>翻譯成功！</b>${M(ansTex)}，${it.kind === 'p2r' ? '直升機已經出發。' : '雷達天線已經轉向。'}${slope}`, 'ok'); setStatus('翻譯成功', 'ok'); }
    else { feedback(`${msg}<br><br>正確答案：${M(ansTex)}。看看雷達上的三角形，想想差在哪裡，再前往下一個任務。`, 'warn'); setStatus('已顯示正確答案', 'warn'); }
    $('btn-submit').classList.add('hidden');
    $('btn-next').classList.remove('hidden');
    kpHide();
  },
  next() {
    this.idx++;
    if (this.idx >= L2_ITEMS.length) { kpHide(); showOutro(2); }
    else this.startItem();
  }
};

/* =========================================================
   第三關：形成性評量（限時、一次）
   六題依上課順序：讀點、同界角、極 → 直 × 2、求 r、直 → 極
   每題的正確選項一律放在 opts[0]（伺服器以答案編號 = 0 計分），
   tag 是錯誤選項對應的迷思，會顯示在老師後台的「題目分析」。
   ========================================================= */
const L3_ITEMS = [
  { name: '讀點', obj: { x: 3 * Math.cos(150 * Math.PI / 180), y: 3 * Math.sin(150 * Math.PI / 180), emoji: '📍', blink: true },
    q: `雷達偵測到撤離點的位置（圖上的 📍），讀出它的極坐標 ${M(R`[r,\theta]`)}：`, opts: [
    { t: R`[3,\ 150^\circ]`, ok: true },
    { t: R`[150^\circ,\ 3]`, tag: 'r、θ 順序寫反' },
    { t: R`[3,\ 30^\circ]`, tag: '從 x 軸負向量角' },
    { t: R`[3,\ 210^\circ]`, tag: '順時針量角' } ] },
  { name: '同界角',
    q: `救難直升機從極軸出發，<b>逆時針</b>飛了 ${M(R`420^\circ`)}，停在離雷達站 <b>2 格</b>的地方。依約定（${M(R`0^\circ \le \theta < 360^\circ`)}）寫出它的極坐標：`, opts: [
    { t: R`[2,\ 60^\circ]`, ok: true },
    { t: R`[2,\ 420^\circ]`, tag: '沒換到 0°～360°' },
    { t: R`[2,\ -60^\circ]`, tag: '旋轉方向弄反' },
    { t: R`[2,\ 300^\circ]`, tag: '用 360° 去減' } ] },
  { name: '極 → 直（第二象限）',
    q: `雷達鎖定一艘受困漁船在 ${M(R`[4,\ 150^\circ]`)}，把它換成直角坐標 ${M('(x,y)')}，讓直升機出發：`, opts: [
    { t: R`(-2\sqrt{3},\ 2)`, ok: true },
    { t: R`(2\sqrt{3},\ 2)`, tag: '忽略負號' },
    { t: R`(2,\ -2\sqrt{3})`, tag: 'x、y 對調' },
    { t: R`(-2,\ 2\sqrt{3})`, tag: 'sin、cos 用反' } ] },
  { name: '極 → 直（第三象限）',
    q: `雷達鎖定一艘救生艇在 ${M(R`[4,\ 225^\circ]`)}，把它換成直角坐標 ${M('(x,y)')}：`, opts: [
    { t: R`(-2\sqrt{2},\ -2\sqrt{2})`, ok: true },
    { t: R`(2\sqrt{2},\ 2\sqrt{2})`, tag: '忽略負號' },
    { t: R`(-4,\ -4)`, tag: '把 r 當成 x、y' },
    { t: R`(-2\sqrt{2},\ 2\sqrt{2})`, tag: 'sin 的正負號錯' } ] },
  { name: '直 → 極：求 r',
    q: `直升機回報一處撤離點在 ${M(R`(-3,\ -4)`)}，它離雷達站多遠？`, opts: [
    { t: R`r = 5`, ok: true },
    { t: R`r = 7`, tag: 'r 用 |x| + |y|' },
    { t: R`r = 25`, tag: '忘了開根號' },
    { t: R`r = \sqrt{7}`, tag: 'r 用 y² − x²' } ] },
  { name: '直 → 極', obj: { x: -3, y: 3, emoji: '📍', blink: true },
    q: `直升機回報最後一處撤離點在 ${M(R`(-3,\ 3)`)}（圖上的 📍），寫出它的極坐標 ${M(R`[r,\theta]`)}：`, opts: [
    { t: R`[3\sqrt{2},\ 135^\circ]`, ok: true },
    { t: R`[3\sqrt{2},\ 45^\circ]`, tag: '角度看錯方向' },
    { t: R`[6,\ 135^\circ]`, tag: 'r 用 |x| + |y|' },
    { t: R`[3,\ 135^\circ]`, tag: 'r 只取 |x|' } ] }
];

const L3 = {
  started: false, done: false, answers: [], order: [], q: 0, startAt: 0, endAt: 0, timer: null,
  auto: false, score: 0, used: 0, busy: false, sending: false,
  reset() {
    clearInterval(this.timer);
    Object.assign(this, { started: false, done: false, answers: [], order: [], q: 0, startAt: 0, endAt: 0, timer: null, auto: false, score: 0, used: 0, busy: false, sending: false });
  },
  progKey() { return 'typhoon.l3.' + (state.user ? state.user.account : ''); },
  saveProg() { store.set(this.progKey(), { order: this.order, answers: this.answers }); },
  inProgress() { return this.started && !this.done; },
  restore(l3, serverNow) {
    this.reset();
    if (!l3) return;
    if (l3.submitted) { this.done = true; this.score = l3.score; this.used = (l3.used_seconds || 0) * 1000; this.auto = !!l3.auto; return; }
    this.arm(l3.started_at, serverNow);
  },
  arm(startedAt, serverNow) {
    const skew = Date.now() - new Date(serverNow).getTime();   // 以伺服器時間為準
    this.startAt = new Date(startedAt).getTime() + skew;
    this.endAt = this.startAt + state.timeLimit * 1000;
    this.started = true;
    const p = store.get(this.progKey());
    if (p && Array.isArray(p.order) && p.order.length === L3_ITEMS.length) {
      this.order = p.order;
      this.answers = Array.isArray(p.answers) ? p.answers : new Array(L3_ITEMS.length).fill(null);
    } else {
      this.order = L3_ITEMS.map(it => it.opts.map((_, i) => i).sort(() => Math.random() - 0.5));
      this.answers = new Array(L3_ITEMS.length).fill(null);
      this.saveProg();
    }
  },
  init() {
    state.level = 3;
    $('main-app').dataset.lv = '';
    Object.assign(view, { maxR: 5, axes: true, polarHint: false, land: true, station: true });
    Object.assign(scene, { objects: [], marker: null, ghost: null, tri: null, anim: null });
    pickEnabled = false; onPick = null; kpHide();
    $('btn-restart').classList.add('hidden');
    $('legend').innerHTML = 'r ≥ 0，0° ≤ θ &lt; 360°<br>不需要計算機';
    setPanel('🌀 颱風危機：象限挑戰', `限時${timeText(state.timeLimit)}，只能作答一次`);
    if (this.done) this.renderResult();
    else if (this.started) { this.startTimer(); this.renderQuestion(); }
    else this.renderIntro();
  },
  renderIntro() {
    $('stage-timer').classList.add('hidden');
    setStatus('等待開始作答', 'warn');
    $('panel-data').innerHTML = '';
    $('tasks').innerHTML = `
      <section class="bg-red-50 p-4 rounded-xl border border-red-200">
        <h2 class="font-bold text-red-800 text-base mb-3">⏱️ 撤離任務規則</h2>
        <ul class="text-sm text-slate-700 space-y-2 leading-relaxed list-disc pl-5">
          <li>共 6 個撤離點，涵蓋今天學的全部內容：讀點、同界角、極坐標與直角坐標互換。</li>
          <li>每題從四個選項中選出正確答案，不需要計算機。</li>
          <li>限時${timeText(state.timeLimit)}，時間到系統會自動送出。</li>
          <li>只有一次機會，開始後不能重來；不小心重新整理，計時也不會停。</li>
          <li>作答時不顯示對錯，送出前都可以回頭修改；在最後一題按「送出全部指令」就會直接交卷。</li>
        </ul>
        <div id="start-area">
          <button id="btn-l3-start" class="${btnBase} bg-red-600 hover:bg-red-700 !py-3 !text-base">開始作答</button>
        </div>
      </section>`;
    $('btn-l3-start').onclick = () => {
      $('start-area').innerHTML = `<div class="mt-3 bg-white border border-red-300 rounded-lg p-3 text-sm text-red-800">確定要開始嗎？開始後計時不會暫停，也不能重來。
        <div class="flex gap-2 mt-3"><button id="l3-no" class="flex-1 bg-slate-200 hover:bg-slate-300 text-slate-700 font-bold py-2 rounded-lg">再想想</button><button id="l3-yes" class="flex-1 bg-red-600 hover:bg-red-700 text-white font-bold py-2 rounded-lg">確定開始</button></div></div>`;
      $('l3-no').onclick = () => this.renderIntro();
      $('l3-yes').onclick = () => this.start();
    };
  },
  async start() {
    if (this.busy) return;
    this.busy = true;
    $('start-area').innerHTML = '<p class="mt-3 text-sm text-slate-600 text-center">連線中……</p>';
    try {
      const r = await API.l3Start();
      if (!r || !r.ok) {
        if (r && r.reason === 'login') { forceLogin('登入已過期，請重新登入。'); return; }
        const msg = r && r.reason === 'locked' ? '請先輸入第三關的授權碼。' : '無法開始作答，請稍後再試。';
        $('start-area').innerHTML = `<p class="mt-3 text-sm text-red-700 text-center">${msg}</p>`;
        return;
      }
      if (r.submitted) { this.done = true; this.score = r.score; this.used = (r.used_seconds || 0) * 1000; this.renderResult(); return; }
      if (r.time_limit) state.timeLimit = r.time_limit;
      this.arm(r.started_at, r.server_now);
      report({ type: 'l3_start', level: 3 });
      this.q = 0;
      this.startTimer();
      this.renderQuestion();
    } catch (e) {
      $('start-area').innerHTML = `<p class="mt-3 text-sm text-red-700 text-center">無法連上伺服器，請確認網路。</p><button id="btn-l3-retry" class="${btnBase} bg-red-600 hover:bg-red-700">再試一次</button>`;
      $('btn-l3-retry').onclick = () => this.start();
    } finally { this.busy = false; }
  },
  startTimer() {
    clearInterval(this.timer);
    $('stage-timer').classList.remove('hidden');
    this.timer = setInterval(() => this.tick(), 250);
    this.tick();
  },
  tick() {
    const left = this.endAt - Date.now();
    const txt = fmtTime(left);
    $('stage-timer').textContent = txt;
    const pt = $('panel-timer');
    if (pt) { pt.textContent = txt; pt.classList.toggle('text-red-600', left <= 30000); }
    if (left <= 0 && !this.done && !this.sending) this.finish(true);
  },
  renderQuestion() {
    if (this.done || this.sending) return;
    const it = L3_ITEMS[this.q];
    scene.objects = it.obj ? [{ ...it.obj, label: `撤離點 ${this.q + 1}`, size: 26 }] : [];
    setStatus(`撤離點 ${this.q + 1}：下達指令`, 'idle');
    const chips = L3_ITEMS.map((_, i) => {
      const c = i === this.q ? 'bg-red-600 text-white' : this.answers[i] != null ? 'bg-sky-100 text-sky-800 border-sky-300' : 'bg-white text-slate-500 border-slate-300';
      return `<button data-q="${i}" class="chip w-8 h-8 rounded-full border text-sm font-bold ${c}">${i + 1}</button>`;
    }).join('');
    $('panel-data').innerHTML = `<div class="flex items-center justify-between gap-2">
        <div class="flex gap-1.5 flex-wrap">${chips}</div>
        <div class="text-right shrink-0"><div class="text-[11px] text-slate-500 font-bold">剩餘時間</div><div id="panel-timer" class="font-black text-2xl tabular-nums text-slate-800">${fmtTime(this.endAt - Date.now())}</div></div>
      </div>`;
    document.querySelectorAll('.chip').forEach(b => b.onclick = () => { this.q = +b.dataset.q; this.renderQuestion(); });
    const opts = this.order[this.q].map(i => {
      const sel = this.answers[this.q] === i;
      return `<button data-i="${i}" class="opt-btn rounded-xl border-2 py-3 px-2 text-lg font-bold transition-colors ${sel ? 'border-red-500 bg-red-50 text-red-800' : 'border-slate-300 bg-white text-slate-800 hover:border-red-300'}">${M(it.opts[i].t)}</button>`;
    }).join('');
    const last = this.q === L3_ITEMS.length - 1;
    $('tasks').innerHTML = `
      <section class="bg-slate-50 p-4 rounded-xl border border-slate-200">
        <h2 class="font-bold text-slate-900 text-base mb-1">📍 撤離點 ${this.q + 1}</h2>
        <p class="text-sm text-slate-700 mb-3 leading-relaxed">${it.q}</p>
        <div class="grid grid-cols-2 gap-2">${opts}</div>
        <div class="flex gap-2 mt-4">
          <button id="q-prev" class="flex-1 bg-slate-200 hover:bg-slate-300 disabled:opacity-40 text-slate-700 font-bold py-2.5 rounded-lg text-sm" ${this.q === 0 ? 'disabled' : ''}>⬅️ 上一題</button>
          ${last ? '<button id="q-submit" class="flex-1 bg-red-600 hover:bg-red-700 text-white font-bold py-2.5 rounded-lg text-sm">📨 送出全部指令</button>'
                 : '<button id="q-next" class="flex-1 bg-sky-600 hover:bg-sky-700 text-white font-bold py-2.5 rounded-lg text-sm">下一題 ➡️</button>'}
        </div>
      </section>`;
    document.querySelectorAll('.opt-btn').forEach(b => b.onclick = () => {
      this.answers[this.q] = +b.dataset.i;
      this.saveProg();
      document.querySelectorAll('.opt-btn').forEach(o => {
        const on = o === b;
        o.classList.toggle('border-red-500', on); o.classList.toggle('bg-red-50', on); o.classList.toggle('text-red-800', on);
        o.classList.toggle('border-slate-300', !on); o.classList.toggle('bg-white', !on); o.classList.toggle('text-slate-800', !on);
      });
      const chip = document.querySelector(`.chip[data-q="${this.q}"]`);
      if (chip) chip.classList.add('ring-2', 'ring-sky-300');
    });
    $('q-prev').onclick = () => { this.q--; this.renderQuestion(); };
    if (last) $('q-submit').onclick = () => this.finish(false);   // 直接送出，不再二次確認
    else $('q-next').onclick = () => { this.q++; this.renderQuestion(); };
    typeset($('tasks'));
  },
  async finish(auto) {
    if (this.done || this.sending) return;
    this.sending = true; this.auto = auto;
    clearInterval(this.timer);
    $('stage-timer').classList.add('hidden');
    $('panel-data').innerHTML = '';
    $('tasks').innerHTML = `<section class="bg-slate-50 p-4 rounded-xl border border-slate-200 text-center text-sm text-slate-600">${auto ? '時間到，' : ''}正在送出撤離指令……</section>`;
    try {
      const r = await API.l3Submit(this.answers, auto);
      if (!r || !r.ok) {
        if (r && r.reason === 'login') { this.sending = false; forceLogin('登入已過期，請重新登入。'); return; }
        throw new Error((r && r.reason) || 'submit');
      }
      this.done = true;
      this.score = r.score; this.used = (r.used_seconds || 0) * 1000;
      L3_ITEMS.forEach((it, i) => {
        const a = this.answers[i], opt = a == null ? null : it.opts[a];
        report({ level: 3, item: i + 1, answer: opt ? opt.t : null, correct: !!(opt && opt.ok), tag: opt ? (opt.ok ? 'ok' : opt.tag) : 'blank' });
      });
      store.del(this.progKey());
      this.renderResult();
    } catch (e) {
      $('tasks').innerHTML = `<section class="bg-red-50 p-4 rounded-xl border border-red-200 text-center">
        <p class="text-sm text-red-800">送出失敗，請確認網路連線。你的答案還保留在這台裝置上。</p>
        <button id="btn-l3-resend" class="${btnBase} bg-red-600 hover:bg-red-700">重新送出</button></section>`;
      $('btn-l3-resend').onclick = () => this.finish(auto);
    } finally { this.sending = false; }
  },
  renderResult() {
    $('stage-timer').classList.add('hidden');
    scene.objects = [];
    setStatus('撤離指令已送出', 'ok');
    $('panel-data').innerHTML = '';
    $('tasks').innerHTML = `
      <section class="bg-green-50 p-4 rounded-xl border border-green-200 text-center">
        <h2 class="font-bold text-green-800 text-lg mb-1">📨 撤離指令已送出</h2>
        ${this.auto ? '<p class="text-sm text-amber-700 mb-2">時間到，系統已自動送出你的指令。</p>' : ''}
        <div class="text-5xl font-black text-slate-800 my-3">${this.score} <span class="text-2xl text-slate-400">/ ${L3_ITEMS.length}</span></div>
        <p class="text-sm text-slate-600">用時 ${fmtTime(this.used)}</p>
        <button id="btn-l3-report" class="${btnMain} animate-pulse">📞 回報指揮中心</button>
        <button id="btn-l3-summary" class="${btnBase} bg-indigo-600 hover:bg-indigo-700">📊 查看排名與每題對錯</button>
      </section>`;
    $('btn-l3-report').onclick = () => showOutro(3);
    $('btn-l3-summary').onclick = () => openSummary();
  }
};

const LEVELS = { 1: L1, 2: L2, 3: L3 };
boot();
</script>
</body>
</html>
